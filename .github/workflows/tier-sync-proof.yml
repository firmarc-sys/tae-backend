name: Jahorin Stripe-to-Neon Tier Sync Proof

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy ARI to Cloud Run']
    types: [completed]

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  TEST_GID: '999000000001'

jobs:
  proof:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preserve stronger real Stripe lifecycle evidence
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const fs=require('fs'); if(!fs.existsSync('STRIPE_LIFECYCLE_PROOF.json')) process.exit(1); const p=JSON.parse(fs.readFileSync('STRIPE_LIFECYCLE_PROOF.json')); if(!(p.ok===true&&p.real_stripe_object_lifecycle===true)) process.exit(1)"; then
            echo 'PRESERVE_REAL_STRIPE_PROOF=true' >> "$GITHUB_ENV"
            echo 'PASS real Stripe lifecycle evidence already exists; synthetic contract proof will not downgrade it.'
          else
            echo 'PRESERVE_REAL_STRIPE_PROOF=false' >> "$GITHUB_ENV"
          fi

      - id: auth
        if: ${{ env.PRESERVE_REAL_STRIPE_PROOF != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - if: ${{ env.PRESERVE_REAL_STRIPE_PROOF != 'true' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Materialize webhook authority only into an ephemeral file
        if: ${{ env.PRESERVE_REAL_STRIPE_PROOF != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud secrets versions access latest \
            --secret=ari-stripe-webhook-secret \
            --project="$GCP_PROJECT_ID" > /tmp/stripe-webhook-secret
          test -s /tmp/stripe-webhook-secret
          echo 'Stripe webhook authority read from Secret Manager without GitHub environment export.'

      - name: Prove signed production webhook transitions into Neon
        if: ${{ env.PRESERVE_REAL_STRIPE_PROOF != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"

          sign_and_post() {
            file="$1"
            out="$2"
            ts="$(date +%s)"
            sig="$(FILE="$file" TS="$ts" node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const payload=fs.readFileSync(process.env.FILE);
          const secret=fs.readFileSync('/tmp/stripe-webhook-secret','utf8').trim();
          process.stdout.write(crypto.createHmac('sha256',secret).update(process.env.TS+'.'+payload).digest('hex'));
          NODE
          )"
            curl -fsS \
              -H 'content-type: application/json' \
              -H "stripe-signature: t=${ts},v1=${sig}" \
              --data-binary "@$file" \
              "$ARI/api/stripe/webhook" -o "$out"
          }

          transition() {
            label="$1"
            status="$2"
            tier="$3"
            expected="$4"
            event="evt_jahorin_${label}_${GITHUB_RUN_ID}"
            cat > "/tmp/${label}.json" <<JSON
          {"id":"${event}","object":"event","type":"customer.subscription.updated","data":{"object":{"id":"sub_jahorin_tier_sync","object":"subscription","customer":null,"status":"${status}","metadata":{"gid":"${TEST_GID}","tier":"${tier}"},"items":{"data":[{"price":{"id":null}}]}}}}
          JSON
            sign_and_post "/tmp/${label}.json" "/tmp/${label}-response.json"
            LABEL="$label" EXPECTED="$expected" node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(`/tmp/${process.env.LABEL}-response.json`));
          if(!(j.received===true&&j.canonical_access?.gid===process.env.TEST_GID&&j.canonical_access?.tier_id===process.env.EXPECTED)) process.exit(1);
          NODE
            echo "PASS ${label}: ${status}/${tier} -> ${expected}"
          }

          transition activate_pro active pro pro
          transition upgrade_business active business business
          transition downgrade_personal active personal personal
          transition payment_failure past_due personal trial
          transition trialing trialing pro pro
          transition trial_expired incomplete_expired pro trial
          transition canceled canceled pro trial
          transition reactivated active pro pro
          transition renewal active pro pro

          node - <<'NODE'
          const fs=require('fs');
          const labels=['activate_pro','upgrade_business','downgrade_personal','payment_failure','trialing','trial_expired','canceled','reactivated','renewal'];
          const transitions=Object.fromEntries(labels.map(label=>[label,JSON.parse(fs.readFileSync(`/tmp/${label}-response.json`)).canonical_access?.tier_id||null]));
          const proof={
            ok:true,
            verified_at:new Date().toISOString(),
            production_endpoint:true,
            production_webhook_signature_verified:true,
            secret_manager_authority:true,
            stripe_event_source:'synthetic-signed-contract-proof',
            real_stripe_object_lifecycle:false,
            gid:process.env.TEST_GID,
            transitions,
            authority:'Neon identity_access',
            ga_note:'This proves production signature verification and Stripe-event-to-Neon policy transitions. It does not claim a real Stripe Customer/Subscription lifecycle.'
          };
          fs.writeFileSync('STRIPE_LIFECYCLE_PROOF.json',JSON.stringify(proof,null,2)+'\n');
          NODE
          cat STRIPE_LIFECYCLE_PROOF.json
          shred -u /tmp/stripe-webhook-secret || rm -f /tmp/stripe-webhook-secret

      - name: Record Stripe-to-Neon evidence
        if: ${{ env.PRESERVE_REAL_STRIPE_PROOF != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STRIPE_LIFECYCLE_PROOF.json
          if git diff --cached --quiet; then
            echo 'Stripe lifecycle proof unchanged.'
            exit 0
          fi
          git commit -m "MA'AT: record hardened Stripe-to-Neon lifecycle contract proof"
          git pull --rebase origin main
          git push origin HEAD:main
