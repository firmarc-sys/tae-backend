name: ari-live-deploy-watch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ari-live-deploy-watch
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ARI: https://ari-689058655022.us-west1.run.app
    steps:
      - name: Wait for authenticated production readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?maat=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = "200" ] && python3 - <<'PY'
          import json
          ready=json.load(open('/tmp/ready.json'))
          ok=(
              ready.get('ok') is True
              and ready.get('auth_required') is True
              and ready.get('auth_configured') is True
              and ready.get('guest_auth_configured') is True
              and ready.get('member_auth_configured') is True
              and ready.get('provider_configured') is True
              and ready.get('provider') in ('google-vertex-ai','google-gemini-api')
              and ready.get('mercury_runtime_ready') is True
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo 'ARI did not reach authenticated production readiness.' >&2
            cat /tmp/ready.json >&2 || true
            exit 1
          fi
          echo 'PASS ARI readiness + required auth + signed sessions + provider + Mercury'

          for route in health identity render-state iot syncori tae; do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "/tmp/$route.json" -w '%{http_code}' "$ARI/api/$route?maat=$GITHUB_SHA")"
            test "$code" = "200" || { echo "/api/$route returned HTTP $code" >&2; cat "/tmp/$route.json" >&2 || true; exit 1; }
            python3 -m json.tool "/tmp/$route.json" >/dev/null
            echo "PASS /api/$route"
          done

      - name: Prove anonymous provider execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 5 --max-time 45 \
            -o /tmp/runtime.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: live-jahorin-auth-smoke' \
            -d '{"capability":"thoth","intent":"This must not execute anonymously","module":"mercury","request_id":"live-jahorin-auth-smoke"}' \
            "$ARI/api/runtime")"
          test "$code" = "401" || { echo "Expected 401, got $code" >&2; cat /tmp/runtime.json >&2; exit 1; }
          echo 'PASS unauthenticated /api/runtime rejected with 401'

          demo_code="$(curl -sS --connect-timeout 5 --max-time 20 \
            -o /tmp/demo.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"prompt":"TAE, enter Demo Mode"}' \
            "$ARI/api/tae")"
          test "$demo_code" = "401" || { echo "Expected unauthenticated Demo Mode 401, got $demo_code" >&2; cat /tmp/demo.json >&2; exit 1; }
          echo 'PASS unauthenticated Demo Mode rejected with 401'

      - name: Authenticate and prove live multimodal provider path
        shell: bash
        run: |
          set -euo pipefail

          guest_code="$(curl -sS --connect-timeout 5 --max-time 20 \
            -c /tmp/cookies \
            -o /tmp/guest.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{}' \
            "$ARI/api/identity/guest")"
          test "$guest_code" = "201" || { echo "Expected guest session 201, got $guest_code" >&2; cat /tmp/guest.json >&2 || true; exit 1; }
          python3 - <<'PY'
          import json,re
          guest=json.load(open('/tmp/guest.json'))
          assert guest.get('authenticated') is True, guest
          assert re.fullmatch(r'\d{12}', str(guest.get('gid') or '')), guest
          print('PASS signed guest session established')
          PY

          unsupported="$(curl -sS --connect-timeout 5 --max-time 20 \
            -b /tmp/cookies \
            -o /tmp/unsupported.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: live-optics-parser-authenticated' \
            -d '{"capability":"optics","intent":"fingerprint authenticated image parser","module":"mercury","payload":{"image":{"mime_type":"application/pdf","data":"QQ=="}},"request_id":"live-optics-parser-authenticated"}' \
            "$ARI/api/runtime")"
          test "$unsupported" = "415" || { echo "Expected authenticated unsupported MIME 415, got $unsupported" >&2; cat /tmp/unsupported.json >&2 || true; exit 1; }
          grep -qi 'unsupported inline image MIME type' /tmp/unsupported.json
          echo 'PASS authenticated request reached normalizeInlineImage and returned 415'

          valid="$(curl -sS --connect-timeout 5 --max-time 60 \
            -b /tmp/cookies \
            -o /tmp/optics.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: live-optics-multimodal' \
            -d '{"capability":"optics","intent":"Describe the supplied image briefly.","module":"mercury","payload":{"action":"analyze","image":{"mime_type":"image/png","data":""}},"request_id":"live-optics-multimodal"}' \
            "$ARI/api/runtime")"
          test "$valid" = "200" || { echo "Expected authenticated multimodal HTTP 200, got $valid" >&2; cat /tmp/optics.json >&2 || true; exit 1; }
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/optics.json'))
          media=((body.get('result') or {}).get('media_input') or {})
          assert str((body.get('result') or {}).get('text') or '').strip(), body
          assert media.get('type') == 'image', media
          assert media.get('mime_type') == 'image/png', media
          assert int(media.get('bytes') or 0) > 0, media
          assert ((body.get('provider') or {}).get('name') in ('google-vertex-ai','google-gemini-api')), body.get('provider')
          print('PASS authenticated PNG reached Google multimodal provider and returned grounded media evidence')
          PY

          twin_code="$(curl -sS --connect-timeout 5 --max-time 20 -b /tmp/cookies -o /tmp/twin.json -w '%{http_code}' "$ARI/api/twin")"
          test "$twin_code" = "200" || { echo "Expected authenticated twin HTTP 200, got $twin_code" >&2; exit 1; }
          echo 'PASS authenticated session remains valid through Neon persistence gateway'

      - name: Verify member and owner authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$ARI/api/ready?auth=$GITHUB_SHA" -o /tmp/ready-auth.json
          python3 - <<'PY'
          import json
          ready=json.load(open('/tmp/ready-auth.json'))
          assert ready.get('member_auth_configured') is True, ready
          assert ready.get('guest_auth_configured') is True, ready
          assert ready.get('auth_required') is True, ready
          print('PASS member and signed-session authentication configured and required')
          PY

          owner_configured="$(python3 - <<'PY'
          import json
          ready=json.load(open('/tmp/ready-auth.json'))
          print('true' if ready.get('owner_auth_configured') is True else 'false')
          PY
          )"
          if [ "$owner_configured" = "true" ]; then
            code="$(curl -sS --connect-timeout 5 --max-time 15 \
              -o /tmp/bad-session.json -w '%{http_code}' \
              -H 'content-type: application/json' \
              -d '{"access_code":"__invalid_live_smoke_code__"}' \
              "$ARI/api/identity/session")"
            test "$code" = "401" || { echo "Expected invalid owner credential 401, got $code" >&2; exit 1; }
            echo 'PASS invalid Prime Orchestrator access rejected with 401'
          else
            echo 'INFO Prime Orchestrator access-code session is not configured; member and signed consumer auth remain active'
          fi

      - name: MAAT live verdict
        run: echo 'ARI LIVE AUTHENTICATED MULTIMODAL — PASS'
