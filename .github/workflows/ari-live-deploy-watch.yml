name: ari-live-deploy-watch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ari-live-deploy-watch
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ARI: https://ari-689058655022.us-west1.run.app
    steps:
      - name: Wait for canonical ARI revision
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 12 -o /tmp/health.json -w '%{http_code}' "$ARI/api/health?watch=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = "200" ] && python3 - <<'PY'
          import json
          try:
              body=json.load(open('/tmp/health.json'))
          except Exception:
              raise SystemExit(1)
          ok=(
              body.get('ok') is True
              and body.get('service')=='ARI'
              and body.get('runtime')=='Mercury'
              and 'supabase_configured' in body
              and 'stripe_configured' in body
              and 'billing_configured' in body
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              matched=1
              cat /tmp/health.json
              break
            fi
            sleep 5
          done
          if [ "$matched" -ne 1 ]; then
            echo 'Current Mercury ARI revision did not reach the Cloud Run hostname.' >&2
            echo 'Last response:' >&2
            cat /tmp/health.json >&2 || true
            exit 1
          fi

      - name: Verify gateway surface and production readiness
        shell: bash
        run: |
          set -euo pipefail
          for route in health ready identity render-state iot syncori tae; do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "/tmp/$route.json" -w '%{http_code}' "$ARI/api/$route")"
            if [ "$code" != "200" ]; then
              echo "/api/$route returned HTTP $code" >&2
              cat "/tmp/$route.json" >&2 || true
              exit 1
            fi
            python3 -m json.tool "/tmp/$route.json" >/dev/null
            echo "PASS /api/$route"
          done

          python3 - <<'PY'
          import json
          identity=json.load(open('/tmp/identity.json'))
          ready=json.load(open('/tmp/ready.json'))
          print('ARI readiness:', json.dumps(ready, sort_keys=True))
          assert identity.get('authenticated') is False
          assert ready.get('provider_configured') is True
          assert ready.get('provider') in ('google-vertex-ai','google-gemini-api')
          assert ready.get('member_auth_configured') is True
          assert ready.get('billing_configured') is True
          print('PASS ARI readiness + member auth + Stripe billing')
          PY

      - name: Verify provider routes reject unauthenticated generation
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 5 --max-time 45 \
            -o /tmp/runtime.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: live-jahorin-auth-smoke' \
            -d '{"capability":"text","intent":"Reply with exactly: JAHORIN ONLINE","request_id":"live-jahorin-auth-smoke"}' \
            "$ARI/api/runtime")"
          if [ "$code" != "401" ]; then
            echo "Expected unauthenticated provider generation to return 401, got $code" >&2
            cat /tmp/runtime.json >&2 || true
            exit 1
          fi
          echo 'PASS unauthenticated provider generation rejected with 401'

      - name: Verify member authentication and optional owner path
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$ARI/api/ready" -o /tmp/ready-auth.json
          owner_configured="$(python3 - <<'PY'
          import json
          ready=json.load(open('/tmp/ready-auth.json'))
          if ready.get('member_auth_configured') is not True:
              raise SystemExit('Supabase member authentication is not configured')
          print('true' if ready.get('owner_auth_configured') is True else 'false')
          PY
          )"
          echo 'PASS Supabase member authentication configured'

          if [ "$owner_configured" = "true" ]; then
            code="$(curl -sS --connect-timeout 5 --max-time 15 \
              -o /tmp/bad-session.json -w '%{http_code}' \
              -H 'content-type: application/json' \
              -d '{"access_code":"__invalid_live_smoke_code__"}' \
              "$ARI/api/identity/session")"
            if [ "$code" != "401" ]; then
              echo "Expected invalid Prime Orchestrator access code to return 401, got $code" >&2
              cat /tmp/bad-session.json >&2 || true
              exit 1
            fi
            echo 'PASS invalid Prime Orchestrator access rejected with 401'
          else
            echo 'INFO Prime Orchestrator access-code path is not configured; member auth remains the public authority'
          fi

      - name: Verify demo runtime seam
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'content-type: application/json' \
            -d '{"prompt":"TAE, enter Demo Mode"}' \
            "$ARI/api/tae" -o /tmp/demo.json
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/demo.json'))
          assert body.get('demo') is True
          assert body.get('message') == 'This is not an app. This is me.'
          print('PASS TAE demo runtime seam')
          PY
