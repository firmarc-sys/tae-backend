name: ari-live-deploy-watch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ari-live-deploy-watch
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ARI: https://ari-689058655022.us-west1.run.app
    steps:
      - name: Verify gateway surface and production readiness
        shell: bash
        run: |
          set -euo pipefail
          for route in health ready identity render-state iot syncori tae; do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "/tmp/$route.json" -w '%{http_code}' "$ARI/api/$route?maat=$GITHUB_SHA")"
            if [ "$code" != "200" ]; then
              echo "/api/$route returned HTTP $code" >&2
              cat "/tmp/$route.json" >&2 || true
              exit 1
            fi
            python3 -m json.tool "/tmp/$route.json" >/dev/null
            echo "PASS /api/$route"
          done

          python3 - <<'PY'
          import json
          identity=json.load(open('/tmp/identity.json'))
          ready=json.load(open('/tmp/ready.json'))
          assert identity.get('authenticated') is False, identity
          assert ready.get('ok') is True, ready
          assert ready.get('auth_required') is True, ready
          assert ready.get('auth_configured') is True, ready
          assert ready.get('member_auth_configured') is True, ready
          assert ready.get('provider_configured') is True, ready
          assert ready.get('provider') in ('google-vertex-ai','google-gemini-api'), ready
          assert ready.get('mercury_runtime_ready') is True, ready
          print('PASS ARI readiness + enforced auth + provider + Mercury')
          PY

      - name: Prove anonymous provider execution is blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 5 --max-time 45 \
            -o /tmp/runtime.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: live-jahorin-auth-smoke' \
            -d '{"capability":"thoth","intent":"This must not execute anonymously","module":"mercury","request_id":"live-jahorin-auth-smoke"}' \
            "$ARI/api/runtime")"
          test "$code" = "401" || { echo "Expected 401, got $code" >&2; cat /tmp/runtime.json >&2; exit 1; }
          echo 'PASS unauthenticated /api/runtime rejected with 401'

          demo_code="$(curl -sS --connect-timeout 5 --max-time 20 \
            -o /tmp/demo.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"prompt":"TAE, enter Demo Mode"}' \
            "$ARI/api/tae")"
          test "$demo_code" = "401" || { echo "Expected unauthenticated Demo Mode 401, got $demo_code" >&2; cat /tmp/demo.json >&2; exit 1; }
          echo 'PASS unauthenticated Demo Mode rejected with 401'

      - name: Fingerprint live multimodal parser before auth
        shell: bash
        run: |
          set -euo pipefail
          unsupported="$(curl -sS --connect-timeout 5 --max-time 20 \
            -o /tmp/unsupported.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: live-optics-parser-fingerprint' \
            -d '{"capability":"optics","intent":"fingerprint image parser","module":"mercury","payload":{"image":{"mime_type":"application/pdf","data":"QQ=="}},"request_id":"live-optics-parser-fingerprint"}' \
            "$ARI/api/runtime")"
          if [ "$unsupported" != "415" ]; then
            echo "Expected live multimodal parser to reject unsupported MIME with 415 before auth; got $unsupported" >&2
            cat /tmp/unsupported.json >&2 || true
            exit 1
          fi
          grep -qi 'unsupported inline image MIME type' /tmp/unsupported.json
          echo 'PASS live normalizeInlineImage parser fingerprinted with 415'

          valid="$(curl -sS --connect-timeout 5 --max-time 20 \
            -o /tmp/valid-image.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: live-optics-auth-boundary' \
            -d '{"capability":"optics","intent":"describe image","module":"mercury","payload":{"image":{"mime_type":"image/png","data":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl9ZQAAAABJRU5ErkJggg=="}},"request_id":"live-optics-auth-boundary"}' \
            "$ARI/api/runtime")"
          if [ "$valid" != "401" ]; then
            echo "Expected valid image to reach auth boundary and return 401; got $valid" >&2
            cat /tmp/valid-image.json >&2 || true
            exit 1
          fi
          echo 'PASS valid image payload accepted by parser but blocked by auth boundary'

      - name: Verify member and owner authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$ARI/api/ready?auth=$GITHUB_SHA" -o /tmp/ready-auth.json
          python3 - <<'PY'
          import json
          ready=json.load(open('/tmp/ready-auth.json'))
          assert ready.get('member_auth_configured') is True, ready
          assert ready.get('auth_required') is True, ready
          print('PASS member authentication configured and required')
          PY

          owner_configured="$(python3 - <<'PY'
          import json
          ready=json.load(open('/tmp/ready-auth.json'))
          print('true' if ready.get('owner_auth_configured') is True else 'false')
          PY
          )"
          if [ "$owner_configured" = "true" ]; then
            code="$(curl -sS --connect-timeout 5 --max-time 15 \
              -o /tmp/bad-session.json -w '%{http_code}' \
              -H 'content-type: application/json' \
              -d '{"access_code":"__invalid_live_smoke_code__"}' \
              "$ARI/api/identity/session")"
            test "$code" = "401" || { echo "Expected invalid owner credential 401, got $code" >&2; exit 1; }
            echo 'PASS invalid Prime Orchestrator access rejected with 401'
          else
            echo 'INFO owner access-code session is not configured; Supabase member authentication is the active authority'
          fi

      - name: MAAT live verdict
        run: echo 'ARI LIVE AUTH + MULTIMODAL PARSER — PASS'
