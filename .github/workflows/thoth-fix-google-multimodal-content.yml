name: THOTH canonical Google multimodal content repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thoth-fix-google-multimodal-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Google multimodal request shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('server.js')
          text=path.read_text()
          old='  const contents = image ? [{ inlineData: { mimeType: image.mimeType, data: image.data } }, { text: prompt }] : prompt;'
          new='  const contents = image ? [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: image.mimeType, data: image.data } }] }] : prompt;'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Google multimodal shorthand, found {count}')
          path.write_text(text.replace(old,new))
          PY
          node --check server.js
          grep -Fq 'role: "user", parts: [{ text: prompt }, { inlineData:' server.js
      - name: Commit canonical provider format
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/thoth-fix-google-multimodal-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/thoth-fix-google-multimodal-content.yml
          git commit -m "THOTH: use canonical Vertex multimodal content parts"
          git pull --rebase origin main
          git push origin HEAD:main
