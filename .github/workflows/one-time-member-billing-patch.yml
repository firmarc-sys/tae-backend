name: one-time-member-billing-patch

on:
  push:
    branches: [thoth/stripe-supabase-production]
    paths:
      - scripts/patch_member_billing_access.py
      - .github/workflows/one-time-member-billing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/stripe-supabase-production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch member billing access
        run: python3 scripts/patch_member_billing_access.py
      - name: Validate Node syntax
        run: node --check server.js
      - name: Commit patched server
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "Allow Supabase members through Mercury provider gate"
          git push origin HEAD:thoth/stripe-supabase-production
