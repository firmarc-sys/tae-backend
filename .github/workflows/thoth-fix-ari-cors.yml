name: thoth-fix-ari-cors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thoth-fix-ari-cors.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thoth-fix-ari-cors
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical ARI backend
        uses: actions/checkout@v4

      - name: Patch credentialed CORS and cross-site session policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          server = Path('server.js')
          s = server.read_text()

          old_origins = '''const defaultOrigins = [
            "https://jahorin-mercury.netlify.app",
            "https://mercury-timerunner.netlify.app",
            "https://siaas.space",
            "https://www.siaas.space",
            "https://myaihome.space",
            "http://localhost:5173",
          ];
          const allowedOrigins = (process.env.ALLOWED_ORIGINS || defaultOrigins.join(","))
            .split(",")
            .map((origin) => origin.trim())
            .filter(Boolean);'''

          new_origins = '''const defaultOrigins = [
            "https://jahorin-mercury.netlify.app",
            "https://mercury-timerunner.netlify.app",
            "https://siaas.netlify.app",
            "https://main--siaas.netlify.app",
            "https://siaas.space",
            "https://www.siaas.space",
            "https://myaihome.space",
            "http://localhost:5173",
          ];
          const configuredOrigins = (process.env.ALLOWED_ORIGINS || "")
            .split(",")
            .map((origin) => origin.trim())
            .filter(Boolean);
          // Defaults are always retained so a stale Cloud Run ALLOWED_ORIGINS value cannot
          // accidentally remove the canonical Jahorin production origin.
          const allowedOrigins = [...new Set([...defaultOrigins, ...configuredOrigins])];
          const trustedOriginPatterns = [
            // Netlify deploy/branch aliases that belong specifically to the `siaas` site.
            /^https:\/\/(?:[a-z0-9-]+--)?siaas\.netlify\.app$/i,
          ];
          function isAllowedOrigin(origin) {
            return allowedOrigins.includes("*") || allowedOrigins.includes(origin) || trustedOriginPatterns.some((pattern) => pattern.test(origin));
          }'''

          if old_origins not in s:
              raise SystemExit('Expected ARI origin block not found; refusing unsafe blind patch')
          s = s.replace(old_origins, new_origins, 1)

          old_cors = '''  cors({
            credentials: true,
            origin(origin, callback) {
              if (!origin || allowedOrigins.includes("*") || allowedOrigins.includes(origin)) {
                return callback(null, true);
              }
              return callback(new Error("Origin not allowed"));
            },
          }),'''
          new_cors = '''  cors({
            credentials: true,
            methods: ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
            allowedHeaders: ["Content-Type", "Authorization", "X-Request-Id", "Accept"],
            exposedHeaders: ["X-Request-Id", "X-Runtime"],
            maxAge: 86400,
            optionsSuccessStatus: 204,
            origin(origin, callback) {
              if (!origin || isAllowedOrigin(origin)) {
                return callback(null, true);
              }
              return callback(new Error("Origin not allowed"));
            },
          }),'''
          if old_cors not in s:
              raise SystemExit('Expected ARI CORS middleware not found; refusing unsafe blind patch')
          s = s.replace(old_cors, new_cors, 1)

          strict_count = s.count('SameSite=Strict')
          if strict_count != 2:
              raise SystemExit(f'Expected exactly 2 SameSite=Strict cookie attributes, found {strict_count}')
          # The cookie stays HttpOnly + Secure. SameSite=None is required because the
          # canonical frontend and Cloud Run API are intentionally on different sites.
          s = s.replace('SameSite=Strict', 'SameSite=None')

          server.write_text(s)

          watch = Path('.github/workflows/ari-live-deploy-watch.yml')
          w = watch.read_text()
          marker = '''      - name: Verify provider routes reject unauthenticated generation
'''
          cors_probe = '''      - name: Verify credentialed CORS from canonical Jahorin origin
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://siaas.netlify.app"
          passed=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 \\
              -D /tmp/cors.headers -o /tmp/cors.body -w '%{http_code}' \\
              -X OPTIONS \\
              -H "Origin: $ORIGIN" \\
              -H 'Access-Control-Request-Method: POST' \\
              -H 'Access-Control-Request-Headers: content-type,x-request-id' \\
              "$ARI/api/runtime" || true)"
            if [ "$code" = "204" ] && python3 - <<'PY'
          from pathlib import Path
          headers={}
          for line in Path('/tmp/cors.headers').read_text().splitlines():
              if ':' in line:
                  k,v=line.split(':',1)
                  headers[k.strip().lower()]=v.strip()
          assert headers.get('access-control-allow-origin') == 'https://siaas.netlify.app', headers
          assert headers.get('access-control-allow-credentials','').lower() == 'true', headers
          assert 'POST' in headers.get('access-control-allow-methods',''), headers
          assert 'content-type' in headers.get('access-control-allow-headers','').lower(), headers
          PY
            then
              passed=1
              break
            fi
            sleep 5
          done
          if [ "$passed" -ne 1 ]; then
            echo 'ARI credentialed CORS did not reach the canonical Cloud Run service.' >&2
            cat /tmp/cors.headers >&2 || true
            cat /tmp/cors.body >&2 || true
            exit 1
          fi

          code="$(curl -sS --connect-timeout 5 --max-time 15 \\
            -D /tmp/identity-cors.headers -o /tmp/identity-cors.json -w '%{http_code}' \\
            -H "Origin: $ORIGIN" \\
            "$ARI/api/identity")"
          test "$code" = "200"
          python3 - <<'PY'
          from pathlib import Path
          headers={}
          for line in Path('/tmp/identity-cors.headers').read_text().splitlines():
              if ':' in line:
                  k,v=line.split(':',1)
                  headers[k.strip().lower()]=v.strip()
          assert headers.get('access-control-allow-origin') == 'https://siaas.netlify.app', headers
          assert headers.get('access-control-allow-credentials','').lower() == 'true', headers
          print('PASS canonical Jahorin credentialed CORS')
          PY

'''
          if marker not in w:
              raise SystemExit('Live deploy watch insertion point not found')
          if 'Verify credentialed CORS from canonical Jahorin origin' not in w:
              w = w.replace(marker, cors_probe + marker, 1)
          watch.write_text(w)

          env = Path('.env.example')
          e = env.read_text()
          e = e.replace(
              'https://jahorin-mercury.netlify.app,https://mercury-timerunner.netlify.app,https://siaas.space',
              'https://jahorin-mercury.netlify.app,https://mercury-timerunner.netlify.app,https://siaas.netlify.app,https://main--siaas.netlify.app,https://siaas.space',
          )
          env.write_text(e)
          PY

      - name: Validate backend syntax and CORS policy
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          grep -q 'https://siaas.netlify.app' server.js
          grep -q 'SameSite=None' server.js
          ! grep -q 'SameSite=Strict' server.js
          grep -q 'Verify credentialed CORS from canonical Jahorin origin' .github/workflows/ari-live-deploy-watch.yml

      - name: Commit canonical repair and remove one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/thoth-fix-ari-cors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "THOTH: fix ARI credentialed CORS for Jahorin"
          git pull --rebase origin main
          git push origin HEAD:main
