name: thoth-fix-ari-cors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thoth-fix-ari-cors.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thoth-fix-ari-cors
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical ARI backend
        uses: actions/checkout@v4

      - name: Patch ARI CORS and cross-site fallback cookie
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('server.js')
          s=p.read_text()

          origin_re=re.compile(r'''const defaultOrigins = \[.*?const allowedOrigins = \(process\.env\.ALLOWED_ORIGINS \|\| defaultOrigins\.join\(","\)\)\n  \.split\(","\)\n  \.map\(\(origin\) => origin\.trim\(\)\)\n  \.filter\(Boolean\);''', re.S)
          origin_new='''const defaultOrigins = [
  "https://jahorin-mercury.netlify.app",
  "https://mercury-timerunner.netlify.app",
  "https://siaas.netlify.app",
  "https://main--siaas.netlify.app",
  "https://siaas.space",
  "https://www.siaas.space",
  "https://myaihome.space",
  "http://localhost:5173",
];
const configuredOrigins = (process.env.ALLOWED_ORIGINS || "")
  .split(",")
  .map((origin) => origin.trim())
  .filter(Boolean);
// Keep canonical defaults even when Cloud Run has an older ALLOWED_ORIGINS value.
const allowedOrigins = [...new Set([...defaultOrigins, ...configuredOrigins])];
const trustedOriginPatterns = [
  // Preview / branch aliases belonging specifically to the canonical Netlify `siaas` site.
  /^https:\/\/(?:[a-z0-9-]+--)?siaas\.netlify\.app$/i,
];
function isAllowedOrigin(origin) {
  return allowedOrigins.includes("*") || allowedOrigins.includes(origin) || trustedOriginPatterns.some((pattern) => pattern.test(origin));
}'''
          s,n=origin_re.subn(origin_new,s,count=1)
          if n != 1:
              raise SystemExit(f'origin block patch count={n}; refusing blind patch')

          cors_re=re.compile(r'''app\.use\(\n  cors\(\{\n    credentials: true,\n    origin\(origin, callback\) \{\n      if \(!origin \|\| allowedOrigins\.includes\("\*"\) \|\| allowedOrigins\.includes\(origin\)\) \{\n        return callback\(null, true\);\n      \}\n      return callback\(new Error\("Origin not allowed"\)\);\n    \},\n  \}\),\n\);''')
          cors_new='''app.use(
  cors({
    credentials: true,
    methods: ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
    allowedHeaders: ["Content-Type", "Authorization", "X-Request-Id", "Accept"],
    exposedHeaders: ["X-Request-Id", "X-Runtime"],
    maxAge: 86400,
    optionsSuccessStatus: 204,
    origin(origin, callback) {
      if (!origin || isAllowedOrigin(origin)) {
        return callback(null, true);
      }
      return callback(new Error("Origin not allowed"));
    },
  }),
);'''
          s,n=cors_re.subn(cors_new,s,count=1)
          if n != 1:
              raise SystemExit(f'CORS middleware patch count={n}; refusing blind patch')

          count=s.count('SameSite=Strict')
          if count != 2:
              raise SystemExit(f'expected two Strict cookies, found {count}')
          s=s.replace('SameSite=Strict','SameSite=None')
          p.write_text(s)

          env=Path('.env.example')
          e=env.read_text()
          if 'https://siaas.netlify.app' not in e:
              e=e.replace(
                'https://mercury-timerunner.netlify.app,https://siaas.space',
                'https://mercury-timerunner.netlify.app,https://siaas.netlify.app,https://main--siaas.netlify.app,https://siaas.space'
              )
          env.write_text(e)

          watch=Path('.github/workflows/ari-live-deploy-watch.yml')
          w=watch.read_text()
          marker='      - name: Verify provider routes reject unauthenticated generation\n'
          probe='''      - name: Verify canonical Jahorin credentialed CORS\n        shell: bash\n        run: |\n          set -euo pipefail\n          ORIGIN="https://siaas.netlify.app"\n          passed=0\n          for attempt in $(seq 1 60); do\n            code="$(curl -sS --connect-timeout 5 --max-time 15 -D /tmp/cors.headers -o /tmp/cors.body -w '%{http_code}' -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,x-request-id' "$ARI/api/runtime" || true)"\n            if [ "$code" = "204" ] && grep -qi '^access-control-allow-origin: https://siaas.netlify.app' /tmp/cors.headers && grep -qi '^access-control-allow-credentials: true' /tmp/cors.headers; then\n              passed=1\n              break\n            fi\n            sleep 5\n          done\n          if [ "$passed" -ne 1 ]; then\n            echo 'Credentialed CORS did not reach production ARI.' >&2\n            cat /tmp/cors.headers >&2 || true\n            cat /tmp/cors.body >&2 || true\n            exit 1\n          fi\n          echo 'PASS credentialed CORS from canonical Jahorin origin'\n\n'''
          if 'Verify canonical Jahorin credentialed CORS' not in w:
              if marker not in w:
                  raise SystemExit('live-watch insertion marker missing')
              w=w.replace(marker,probe+marker,1)
          watch.write_text(w)
          PY

      - name: Validate repaired backend
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          grep -q 'https://siaas.netlify.app' server.js
          grep -q 'const configuredOrigins' server.js
          grep -q 'SameSite=None' server.js
          ! grep -q 'SameSite=Strict' server.js
          grep -q 'Verify canonical Jahorin credentialed CORS' .github/workflows/ari-live-deploy-watch.yml

      - name: Commit repair and remove executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/thoth-fix-ari-cors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "THOTH: fix ARI credentialed CORS for Jahorin"
          git pull --rebase origin main
          git push origin HEAD:main
