name: Repair ARI Secret + Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ari-secret-domain.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ari-production-mutation
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  ARI_DOMAIN: ari.jahorin.space

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Repair canonical Stripe webhook secret binding
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets versions access latest --secret=ari-stripe-webhook-secret --project="$GCP_PROJECT_ID" >/dev/null
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --command=node \
            --args=authorization-gateway.js \
            --update-secrets=STRIPE_WEBHOOK_SECRET=ari-stripe-webhook-secret:latest \
            --quiet

          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/service.json'))
          c=(obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers') or [{}])[0]
          found=None
          for item in c.get('env',[]) or []:
              if item.get('name')=='STRIPE_WEBHOOK_SECRET':
                  found=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef')
          if not found: raise SystemExit('STRIPE_WEBHOOK_SECRET is not Secret Manager backed')
          name=found.get('name','')
          if name not in ('ari-stripe-webhook-secret','projects/689058655022/secrets/ari-stripe-webhook-secret'):
              raise SystemExit(f'wrong webhook secret binding: {name}')
          print('PASS canonical Stripe webhook secret binding:', name)
          print('CREATED=',obj.get('status',{}).get('latestCreatedRevisionName'))
          print('READY=',obj.get('status',{}).get('latestReadyRevisionName'))
          PY

      - name: Route traffic to repaired latest revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --to-latest \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/traffic.json
          python3 - <<'PY'
          import json
          o=json.load(open('/tmp/traffic.json'))
          created=o.get('status',{}).get('latestCreatedRevisionName')
          ready=o.get('status',{}).get('latestReadyRevisionName')
          if created!=ready: raise SystemExit(f'latest revision not ready: created={created} ready={ready}')
          traffic=o.get('status',{}).get('traffic') or []
          live=sum(int(x.get('percent') or 0) for x in traffic if x.get('revisionName')==ready or x.get('latestRevision') is True)
          if live!=100: raise SystemExit(f'latest revision not at 100%: {traffic}')
          print('PASS repaired ARI revision is serving 100% traffic:',ready)
          PY

      - name: Prove raw ARI readiness
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?repair=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = 200 ] && node -e "const j=require('/tmp/ready.json'); if(j.ok!==true)process.exit(1)"; then ready=1; break; fi
            sleep 4
          done
          test "$ready" = 1 || { cat /tmp/ready.json >&2 || true; exit 1; }
          echo 'PASS raw ARI readiness.'

      - name: Bind and prove ari.jahorin.space
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud beta run domain-mappings describe \
            --domain="$ARI_DOMAIN" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" >/tmp/domain.txt 2>/tmp/domain.err; then
            cat /tmp/domain.err || true
            gcloud beta run domain-mappings create \
              --service="$CLOUD_RUN_SERVICE" \
              --domain="$ARI_DOMAIN" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --quiet
          fi
          gcloud beta run domain-mappings describe \
            --domain="$ARI_DOMAIN" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='yaml(metadata.name,status.conditions,status.resourceRecords)' || true

          code="$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/domain-ready.json -w '%{http_code}' "https://$ARI_DOMAIN/api/ready?domain=$GITHUB_SHA" || true)"
          echo "DOMAIN_HTTP=$code"
          cat /tmp/domain-ready.json || true
          test "$code" = 200
          node -e "const j=require('/tmp/domain-ready.json'); if(j.ok!==true)process.exit(1)"
          echo 'PASS ari.jahorin.space DNS/TLS/ARI readiness.'
