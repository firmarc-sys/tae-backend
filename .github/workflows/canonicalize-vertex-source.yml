name: Canonicalize Vertex Source

on:
  push:
    branches: [main]
    paths:
      - '.vertex-source-trigger'
      - '.github/workflows/canonicalize-vertex-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonicalize-vertex-source
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Materialize capability-driven Vertex-only source
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZE_GATEWAY_WRITE=true node scripts/normalize-gateway-startup.mjs
          node scripts/enforce-vertex-model-policy.mjs
          node --check server.js
          node --check control-plane-gateway.js
          node --check thoth-voice.js
          node --check vertex-model-registry.js
          node --check vertex-model-router.js
          node --check scripts/enforce-vertex-model-policy.mjs
          node --check scripts/verify-vertex-model-policy.mjs
          node scripts/verify-vertex-model-policy.mjs
          ! grep -IEq 'generativelanguage\.googleapis\.com|google-gemini-api|GEMINI_RUNTIME_API_KEY|THOTH_GEMINI_API_KEY|GEMINI_API_KEY|GOOGLE_API_KEY' server.js control-plane-gateway.js thoth-voice.js vertex-model-router.js
          grep -q 'new VertexModelRouter' server.js
          grep -q 'runtimeProvider = "google-vertex-ai"' control-plane-gateway.js
          grep -q 'thoth_client_provider_token_enabled: false' thoth-voice.js
          echo 'PASS canonical executable provider source is capability-driven and Vertex-only'
      - name: Commit canonicalized provider source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THOTH Execution'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js control-plane-gateway.js thoth-voice.js vertex-model-router.js vertex-model-registry.js scripts/normalize-gateway-startup.mjs .env.example
          if git diff --cached --quiet; then
            echo 'Canonical source already matches authoritative Vertex model policy'
            exit 0
          fi
          git commit -m 'THOTH: canonicalize capability-driven Vertex routing'
          git push origin HEAD:main

