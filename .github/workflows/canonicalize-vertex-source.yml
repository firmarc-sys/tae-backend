name: Canonicalize Vertex Source

on:
  push:
    branches: [main]
    paths:
      - '.vertex-source-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonicalize-vertex-source
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Materialize Vertex-only canonical source
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZE_GATEWAY_WRITE=true node scripts/normalize-gateway-startup.mjs
          node --check server.js
          node --check control-plane-gateway.js
          node --check thoth-voice.js
          node --check vertex-model-router.js
          ! grep -IEq 'generativelanguage\.googleapis\.com|google-gemini-api|GEMINI_RUNTIME_API_KEY|THOTH_GEMINI_API_KEY|GEMINI_API_KEY|GOOGLE_API_KEY' server.js control-plane-gateway.js thoth-voice.js vertex-model-router.js
          grep -q 'new VertexModelRouter' server.js
          grep -q 'runtimeProvider = "google-vertex-ai"' control-plane-gateway.js
          grep -q 'thoth_client_provider_token_enabled: false' thoth-voice.js
          echo 'PASS canonical executable provider source is Vertex-only'
      - name: Commit canonicalized provider source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THOTH Execution'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js control-plane-gateway.js thoth-voice.js
          if git diff --cached --quiet; then
            echo 'Canonical source already matches Vertex-only runtime'
            exit 0
          fi
          git commit -m 'THOTH: canonicalize ARI source to Vertex AI only'
          git push origin HEAD:main
