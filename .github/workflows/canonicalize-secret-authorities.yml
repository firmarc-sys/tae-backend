name: Canonicalize ARI Secret Authorities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonicalize-secret-authorities.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: canonicalize-ari-secret-authorities
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  LEGACY_OWNER_SECRET: OWNER_ACCESS_CODE
  CANONICAL_OWNER_SECRET: ari-owner-access-code
  LEGACY_SUPABASE_SECRET: SUPABASE_SECRET_KEY
  CANONICAL_SUPABASE_SECRET: ari-supabase-secret-key
  LEGACY_STRIPE_SECRET: STRIPE_SECRET_KEY
  CANONICAL_STRIPE_SECRET: ari-stripe-secret-key

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/689058655022/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@project-7e6f2720-0291-4c91-8c3.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Canonicalize owner, Supabase, and Stripe authorities without disclosure
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          ensure_container() {
            target="$1"
            if ! gcloud secrets describe "$target" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$target" --project="$GCP_PROJECT_ID" --replication-policy=automatic --quiet >/dev/null
              echo "PASS created canonical Secret Manager container: $target"
            fi
          }

          copy_latest() {
            source="$1"
            target="$2"
            file="$3"
            gcloud secrets versions access latest --secret="$source" --project="$GCP_PROJECT_ID" > "$file"
            test -s "$file"
            ensure_container "$target"
            gcloud secrets versions add "$target" --project="$GCP_PROJECT_ID" --data-file="$file" --quiet >/dev/null
            echo "PASS canonicalized authority: $target"
          }

          copy_latest "$LEGACY_OWNER_SECRET" "$CANONICAL_OWNER_SECRET" /tmp/owner-authority
          copy_latest "$LEGACY_SUPABASE_SECRET" "$CANONICAL_SUPABASE_SECRET" /tmp/supabase-authority
          copy_latest "$LEGACY_STRIPE_SECRET" "$CANONICAL_STRIPE_SECRET" /tmp/stripe-authority

          if ! grep -Eq '^sb_secret_|^eyJ' /tmp/supabase-authority; then
            echo 'Supabase authority source does not have an expected server credential shape.' >&2
            exit 1
          fi

          if ! grep -Eq '^(sk_live_|rk_live_)' /tmp/stripe-authority; then
            echo 'Stripe authority source is not a live server API key.' >&2
            exit 1
          fi

          for secret in "$CANONICAL_OWNER_SECRET" "$CANONICAL_SUPABASE_SECRET" "$CANONICAL_STRIPE_SECRET"; do
            version="$(gcloud secrets versions list "$secret" --project="$GCP_PROJECT_ID" --filter='state=ENABLED' --limit=1 --sort-by='~createTime' --format='value(name)')"
            test -n "$version" || { echo "No enabled version after canonicalization: $secret" >&2; exit 1; }
          done

          echo "MA'AT secret authority canonicalization: PASS"

      - name: Remove all ephemeral authority material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          for file in /tmp/owner-authority /tmp/supabase-authority /tmp/stripe-authority; do
            if [ -f "$file" ]; then
              if command -v shred >/dev/null 2>&1; then shred -u "$file"; else rm -f "$file"; fi
            fi
          done
          exit 0
