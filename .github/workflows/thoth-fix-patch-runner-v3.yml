name: THOTH fix ARI patch runner v3

on:
  push:
    branches: [thoth/ari-auth-multimodal]
    paths:
      - '.github/workflows/thoth-fix-patch-runner-v3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/ari-auth-multimodal
      - name: Patch one substitution line
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/thoth-patch-ari-auth-multimodal.yml')
          s=p.read_text()
          old='out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new="out, count = re.subn(pattern, (lambda m: m.group(1)) if replacement == r'\\1' else (lambda _m: replacement), text, count=1, flags=re.S)"
          if s.count(old)!=1: raise SystemExit(f'substitution-line target count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/thoth-fix-patch-runner.yml .github/workflows/thoth-fix-patch-runner-v2.yml .github/workflows/thoth-fix-patch-runner-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/thoth-patch-ari-auth-multimodal.yml .github/workflows/thoth-fix-patch-runner.yml .github/workflows/thoth-fix-patch-runner-v2.yml .github/workflows/thoth-fix-patch-runner-v3.yml
          git commit -m "THOTH: finalize ARI patch substitution semantics"
          git push origin HEAD:thoth/ari-auth-multimodal
