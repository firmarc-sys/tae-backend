name: THOTH GA Stripe Mode Proof

on:
  push:
    branches:
      - thoth/ga-stripe-proof
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari

jobs:
  prove-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Classify and normalize mounted Stripe credential without exposing it
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/service.json
          secret_ref="$(python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/service.json'))
          for c in obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              for item in c.get('env',[]) or []:
                  if item.get('name')!='STRIPE_SECRET_KEY': continue
                  ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef') or {}
                  secret=ref.get('name') or ref.get('secret') or ''
                  if secret:
                      print(secret)
                      raise SystemExit
          print('')
          PY
          )"
          test -n "$secret_ref"
          echo "stripe_secret_reference=$secret_ref"
          gcloud secrets versions access latest --secret="$secret_ref" --project="$GCP_PROJECT_ID" > /tmp/stripe-key.raw
          test -s /tmp/stripe-key.raw

          python3 - <<'PY'
          from pathlib import Path
          import json
          raw=Path('/tmp/stripe-key.raw').read_text().strip()
          kind='opaque'
          candidate=raw
          if raw.startswith('{'):
              try:
                  obj=json.loads(raw)
                  kind='json_object'
                  for k in ('STRIPE_SECRET_KEY','stripe_secret_key','secret_key','api_key','key'):
                      if isinstance(obj.get(k),str) and obj[k].strip():
                          candidate=obj[k].strip(); kind=f'json:{k}'; break
              except Exception: kind='malformed_json'
          elif raw.startswith('STRIPE_SECRET_KEY='):
              candidate=raw.split('=',1)[1].strip(); kind='env_assignment'
          elif raw.lower().startswith('bearer '):
              candidate=raw[7:].strip(); kind='bearer_wrapper'
          elif (raw.startswith('"') and raw.endswith('"')) or (raw.startswith("'") and raw.endswith("'")):
              candidate=raw[1:-1].strip(); kind='quoted'
          if candidate.startswith(('sk_test_','rk_test_')): cls='secret_test'
          elif candidate.startswith(('sk_live_','rk_live_')): cls='secret_live'
          elif candidate.startswith(('pk_test_','pk_live_')): cls='publishable'
          elif candidate.startswith('whsec_'): cls='webhook_secret'
          elif candidate.startswith('acct_'): cls='account_id'
          else: cls='unknown'
          print(f'stripe_secret_format={kind}')
          print(f'stripe_key_class={cls}')
          print(f'stripe_secret_length={len(candidate)}')
          Path('/tmp/stripe-key').write_text(candidate)
          PY
          chmod 600 /tmp/stripe-key
          key="$(cat /tmp/stripe-key)"
          echo "::add-mask::$key"

          mode="$(python3 - <<'PY'
          key=open('/tmp/stripe-key').read().strip()
          if key.startswith(('sk_test_','rk_test_')): print('test')
          elif key.startswith(('sk_live_','rk_live_')): print('live')
          else: print('unknown')
          PY
          )"
          code="$(curl -sS --max-time 20 -o /tmp/stripe-events.json -w '%{http_code}' -u "$key:" 'https://api.stripe.com/v1/events?limit=1' || true)"
          echo "stripe_readonly_events_http=$code"
          if [ "$code" = 200 ]; then
            api_mode="$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/stripe-events.json'))
          data=j.get('data') or []
          if data and isinstance(data[0].get('livemode'), bool): print('live' if data[0]['livemode'] else 'test')
          else: print('unknown')
          PY
            )"
            [ "$api_mode" != unknown ] && mode="$api_mode"
          else
            python3 - <<'PY'
          import json
          try:
              j=json.load(open('/tmp/stripe-events.json'))
              err=j.get('error') or {}
              print('stripe_error_type='+str(err.get('type') or 'unknown'))
              print('stripe_error_code='+str(err.get('code') or 'none'))
          except Exception:
              print('stripe_error_type=unparseable')
          PY
          fi
          echo "stripe_credential_mode=$mode"
          rm -f /tmp/stripe-key /tmp/stripe-key.raw /tmp/stripe-events.json
          test "$mode" = test
