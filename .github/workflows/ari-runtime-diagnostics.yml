name: ARI Runtime Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ari-runtime-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Capture runtime state and text logs
        shell: bash
        run: |
          set -euo pipefail
          CREATED="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestCreatedRevisionName)')"
          READY="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "CREATED=$CREATED" >> "$GITHUB_ENV"
          echo "READY=$READY" >> "$GITHUB_ENV"

          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          curl -sS --connect-timeout 5 --max-time 20 "$ARI/api/ready?diagnostic=${GITHUB_SHA}" -o /tmp/ready.json || true
          curl -sS --connect-timeout 5 --max-time 20 "$ARI/api/edge-diagnostics?diagnostic=${GITHUB_SHA}" -o /tmp/edge.json || true

          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="ari" AND textPayload:*' \
            --project="$GCP_PROJECT_ID" \
            --freshness=2h \
            --limit=400 \
            --order=desc \
            --format=json > /tmp/cloud-text.json 2>/dev/null || printf '[]\n' > /tmp/cloud-text.json

      - name: Record sanitized runtime diagnosis
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          function parsed(path,fallback=null){try{return JSON.parse(fs.readFileSync(path,'utf8'))}catch{return fallback}}
          function sanitize(value){
            return String(value||'')
              .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'[email]')
              .replace(/\b\d{12}\b/g,'[gid]')
              .replace(/(?:sk|rk)_(?:live|test)_[A-Za-z0-9_-]+/g,'[stripe-key]')
              .replace(/whsec_[A-Za-z0-9_-]+/g,'[stripe-webhook]')
              .replace(/Bearer\s+\S+/gi,'Bearer [redacted]')
              .replace(/ari_session=[^;\s]+/gi,'ari_session=[redacted]')
              .slice(0,1600);
          }
          const entries=parsed('/tmp/cloud-text.json',[])||[];
          const seen=new Set();
          const textLines=[];
          for(const entry of entries){
            const raw=String(entry?.textPayload||'').trim();
            if(!raw) continue;
            const line=sanitize(raw);
            if(!line||seen.has(line)) continue;
            seen.add(line);
            textLines.push({timestamp:entry?.timestamp||null,severity:entry?.severity||null,message:line,revision:entry?.resource?.labels?.revision_name||null});
            if(textLines.length>=160) break;
          }
          const evidence={
            captured_at:new Date().toISOString(),
            workflow_sha:process.env.GITHUB_SHA,
            latest_created_revision:process.env.CREATED||null,
            latest_ready_revision:process.env.READY||null,
            ready:parsed('/tmp/ready.json'),
            edge:parsed('/tmp/edge.json'),
            text_runtime_lines:textLines,
          };
          fs.writeFileSync('ARI_RUNTIME_DIAGNOSTIC.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARI_RUNTIME_DIAGNOSTIC.json
          git commit -m 'Record Cloud Run text runtime diagnosis' || exit 0
          git push origin HEAD:main
