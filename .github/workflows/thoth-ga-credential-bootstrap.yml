name: THOTH GA Credential Bootstrap

on:
  push:
    branches:
      - thoth/ga-live-proof
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  API_KEY_ID: jahorin-thoth-transcribe
  SECRET_NAME: thoth-gemini-api-key

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Enable required Google services
        shell: bash
        run: |
          set -euo pipefail
          gcloud services enable apikeys.googleapis.com generativelanguage.googleapis.com secretmanager.googleapis.com --project="$GCP_PROJECT_ID" --quiet
      - name: Create restricted THOTH Gemini credential
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud services api-keys describe "$API_KEY_ID" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud services api-keys create \
              --key-id="$API_KEY_ID" \
              --display-name='Jahorin THOTH Transcribe' \
              --api-target=service=generativelanguage.googleapis.com \
              --project="$GCP_PROJECT_ID" \
              --quiet >/dev/null
          fi
          key_string="$(gcloud services api-keys get-key-string "$API_KEY_ID" --project="$GCP_PROJECT_ID" --format='value(keyString)')"
          test -n "$key_string"
          echo "::add-mask::$key_string"
          if ! gcloud secrets describe "$SECRET_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create "$SECRET_NAME" --replication-policy=automatic --project="$GCP_PROJECT_ID" --quiet
          fi
          printf '%s' "$key_string" | gcloud secrets versions add "$SECRET_NAME" --data-file=- --project="$GCP_PROJECT_ID" --quiet >/dev/null
          echo 'Restricted Gemini credential stored in Secret Manager.'
      - name: Authorize ARI runtime and mount secret
        shell: bash
        run: |
          set -euo pipefail
          runtime_sa="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(spec.template.spec.serviceAccountName)')"
          if [ -z "$runtime_sa" ]; then runtime_sa="${GCP_PROJECT_NUMBER}-compute@developer.gserviceaccount.com"; fi
          gcloud secrets add-iam-policy-binding "$SECRET_NAME" \
            --project="$GCP_PROJECT_ID" \
            --member="serviceAccount:${runtime_sa}" \
            --role='roles/secretmanager.secretAccessor' \
            --quiet >/dev/null
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --update-secrets="GEMINI_API_KEY=${SECRET_NAME}:latest" \
            --quiet
          revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "THOTH credential revision: $revision"
      - name: Prove live THOTH voice token
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 24); do
            code="$(curl -sS --max-time 15 -o ready.json -w '%{http_code}' "$ARI/api/ready?thoth-credential=$attempt" || true)"
            if [ "$code" = 200 ] && node -e "const j=require('./ready.json'); if(!(j.ok===true&&j.thoth_voice_configured===true)) process.exit(1)"; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then cat ready.json; exit 10; fi
          node -e "const j=require('./ready.json'); console.log(JSON.stringify({ok:j.ok,thoth_voice_configured:j.thoth_voice_configured,thoth_live_model:j.thoth_live_model,thoth_record_model:j.thoth_record_model},null,2))"
          code="$(curl -sS -c cookies.txt -o guest.json -w '%{http_code}' -H 'content-type: application/json' -d '{}' "$ARI/api/identity/guest")"
          test "$code" = 201
          code="$(curl -sS -b cookies.txt -o voice.json -w '%{http_code}' --max-time 30 -H 'content-type: application/json' -d '{\"mode\":\"live\",\"intelligence\":\"THOTH\"}' "$ARI/api/voice/token")"
          if [ "$code" != 200 ]; then echo "THOTH token HTTP $code"; cat voice.json; exit 11; fi
          node - <<'NODE'
          const j=require('./voice.json');
          if (!(j.ok===true&&j.intelligence==='THOTH'&&j.model==='gemini-3.5-transcribe-live'&&typeof j.token==='string'&&j.token.length>10)) process.exit(12);
          console.log(JSON.stringify({ok:true,intelligence:j.intelligence,mode:j.mode,model:j.model,token_present:true,expires_at:j.expires_at},null,2));
          NODE
