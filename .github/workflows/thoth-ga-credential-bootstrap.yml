name: THOTH GA Credential Rotation

on:
  push:
    branches:
      - thoth/ga-live-proof
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  OLD_API_KEY_ID: jahorin-thoth-transcribe
  NEW_API_KEY_ID: jahorin-thoth-transcribe-v2
  SECRET_NAME: thoth-gemini-api-key

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Create replacement restricted credential without logging key material
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud services api-keys describe "$NEW_API_KEY_ID" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud services api-keys create \
              --key-id="$NEW_API_KEY_ID" \
              --display-name='Jahorin THOTH Transcribe v2' \
              --api-target=service=generativelanguage.googleapis.com \
              --project="$GCP_PROJECT_ID" \
              --quiet >/dev/null 2>&1
          fi
          key_string="$(gcloud services api-keys get-key-string "$NEW_API_KEY_ID" --project="$GCP_PROJECT_ID" --format='value(keyString)' 2>/dev/null)"
          test -n "$key_string"
          echo "::add-mask::$key_string"
          version_name="$(printf '%s' "$key_string" | gcloud secrets versions add "$SECRET_NAME" --data-file=- --project="$GCP_PROJECT_ID" --format='value(name)' --quiet 2>/dev/null)"
          version="${version_name##*/}"
          test -n "$version"
          printf 'THOTH_SECRET_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          echo 'Replacement credential stored as a new Secret Manager version.'
      - name: Pin ARI to replacement secret version
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --update-secrets="GEMINI_API_KEY=${SECRET_NAME}:${THOTH_SECRET_VERSION}" \
            --quiet >/dev/null
          revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "THOTH rotated credential revision: $revision"
      - name: Prove replacement THOTH live token path
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS --max-time 15 -o ready.json -w '%{http_code}' "$ARI/api/ready?thoth-rotation=$attempt" || true)"
            if [ "$code" = 200 ] && node -e "const j=require('./ready.json'); if(!(j.ok===true&&j.thoth_voice_configured===true)) process.exit(1)"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          code="$(curl -sS -c cookies.txt -o guest.json -w '%{http_code}' -H 'content-type: application/json' -d '{}' "$ARI/api/identity/guest")"
          test "$code" = 201
          code="$(curl -sS -b cookies.txt -o voice.json -w '%{http_code}' --max-time 30 -H 'content-type: application/json' -d '{\"mode\":\"live\",\"intelligence\":\"THOTH\"}' "$ARI/api/voice/token")"
          test "$code" = 200
          node - <<'NODE'
          const j=require('./voice.json');
          if (!(j.ok===true&&j.intelligence==='THOTH'&&j.model==='gemini-3.5-transcribe-live'&&typeof j.token==='string'&&j.token.length>10)) process.exit(12);
          console.log(JSON.stringify({ok:true,intelligence:j.intelligence,mode:j.mode,model:j.model,token_present:true},null,2));
          NODE
      - name: Revoke exposed first credential
        shell: bash
        run: |
          set -euo pipefail
          if gcloud services api-keys describe "$OLD_API_KEY_ID" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud services api-keys delete "$OLD_API_KEY_ID" --project="$GCP_PROJECT_ID" --quiet >/dev/null 2>&1
          fi
          echo 'Exposed first credential revoked.'
