name: Sync Vedic Package Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-vedic-package-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vedic-package-lock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile reproducibly
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run check

      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Sync package lock for Vedic runtime'
          git push origin HEAD:main
