name: one-time-canonical-public-identifiers

on:
  push:
    branches: [thoth/member-readiness-canonical-billing]
    paths:
      - .github/workflows/one-time-canonical-public-identifiers.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/member-readiness-canonical-billing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply canonical public identifiers
        run: python3 scripts/patch_canonical_public_identifiers.py
      - run: node --check server.js
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Pin canonical public Supabase and Stripe identifiers"
          git push origin HEAD:thoth/member-readiness-canonical-billing
