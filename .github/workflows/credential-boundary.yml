name: Verify GID Credential Boundary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Verify gateway syntax and credential boundary
        run: npm run check
      - name: Verify production image still builds
        run: docker build -t ari-credential-gate .
