name: one-time-stripe-entitlement-hardening

on:
  push:
    branches: [thoth/stripe-entitlement-hardening]
    paths:
      - scripts/patch_stripe_entitlement_hardening.py
      - .github/workflows/one-time-stripe-entitlement-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/stripe-entitlement-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply entitlement hardening
        run: python3 scripts/patch_stripe_entitlement_hardening.py
      - name: Validate Node syntax
        run: node --check server.js
      - name: Commit patched server
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Harden Stripe entitlement state mapping"
          git push origin HEAD:thoth/stripe-entitlement-hardening
