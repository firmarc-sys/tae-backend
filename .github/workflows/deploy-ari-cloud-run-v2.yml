name: Deploy ARI to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'vedic-gateway.js'
      - 'vedic-profile.js'
      - 'authorization-gateway.js'
      - 'production-gateway.js'
      - 'billing-gateway.js'
      - 'subscription-entitlement-gateway.js'
      - 'secure-gateway.js'
      - 'device-fabric.js'
      - 'control-plane-gateway.js'
      - 'server.js'
      - 'neon-runtime-gateway.js'
      - 'neon-store.js'
      - 'manifest-runtime-gateway.js'
      - 'identity-runtime-gateway.js'
      - 'scripts/prove-device-fabric.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/deploy-ari-cloud-run-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-ari-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: ari

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical TAE backend
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reproducible backend source gate
        run: |
          set -euo pipefail
          npm ci
          npm run check
          node -e "import('astronomy-engine').then(()=>import('tz-lookup')).then(()=>import('./vedic-profile.js')).then(()=>console.log('PASS Vedic runtime imports'))"
          grep -q 'node secure-gateway.js' package.json
          grep -q 'ensureDeviceFabricSchema' secure-gateway.js
          grep -q 'REPLAY_REJECTED' device-fabric.js
          grep -q 'api_rate_limits' device-fabric.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify Secret Manager and current runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets list --project="$GCP_PROJECT_ID" --limit=1 >/dev/null
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/current.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/current.json'))
          required={'ARI_SESSION_SECRET','NEON_DATABASE_URL','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET'}
          found=set(); plain=[]
          for c in obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              for item in c.get('env',[]) or []:
                  name=item.get('name')
                  if name not in required: continue
                  ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef')
                  if ref: found.add(name)
                  elif item.get('value'): plain.append(name)
          if plain: raise SystemExit('Plaintext required secrets remain: '+','.join(sorted(plain)))
          missing=required-found
          if missing: raise SystemExit('Missing required secret references: '+','.join(sorted(missing)))
          print('PASS existing Cloud Run secret bindings are intact')
          PY

      - name: Configure Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null

      - name: Build and push reproducible ARI image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy hardened ARI revision preserving secret bindings
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --command=node \
            --args=authorization-gateway.js \
            --update-env-vars="NODE_ENV=production,ARI_REQUIRE_AUTH=true,JAHORIN_FREE_ACCESS=false" \
            --quiet

          CREATED="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestCreatedRevisionName)')"
          test -n "$CREATED"
          echo "Created Cloud Run revision: $CREATED"

          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --to-latest \
            --quiet

          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/traffic.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/traffic.json'))
          created=obj.get('status',{}).get('latestCreatedRevisionName')
          ready=obj.get('status',{}).get('latestReadyRevisionName')
          traffic=obj.get('status',{}).get('traffic') or []
          if not created or created != ready:
              raise SystemExit(f'latest revision is not ready: created={created} ready={ready}')
          live=sum(int(x.get('percent') or 0) for x in traffic if x.get('revisionName') == ready or x.get('latestRevision') is True)
          if live != 100:
              raise SystemExit(f'latest revision does not have 100% traffic: ready={ready} traffic={traffic}')
          print('PASS latest ARI revision is ready and serving 100% traffic')
          print('REVISION=', ready)
          PY

          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "CLOUD_RUN_REVISION=$REVISION" >> "$GITHUB_ENV"

      - name: Verify Cloud Run secret references
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/deployed.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/deployed.json'))
          required={'ARI_SESSION_SECRET','NEON_DATABASE_URL','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET'}
          found=set(); plain=[]
          for c in obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              for item in c.get('env',[]) or []:
                  name=item.get('name')
                  if name not in required: continue
                  ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef')
                  if ref: found.add(name)
                  elif item.get('value'): plain.append(name)
          if plain: raise SystemExit('Plaintext required secrets remain: '+','.join(sorted(plain)))
          missing=required-found
          if missing: raise SystemExit('Missing required secret references: '+','.join(sorted(missing)))
          print('PASS required secrets remain Cloud Run Secret Manager references')
          PY

      - name: Prove live hardened runtime and Vedic gate
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?release=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = 200 ] && node -e "const j=require('/tmp/ready.json'); if(!(j.ok===true&&j.auth_required===true&&j.auth_configured===true&&j.provider_configured===true&&j.neon_ready===true)) process.exit(1)"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1 || { echo 'Hardened ARI failed readiness.' >&2; cat /tmp/ready.json >&2 || true; exit 1; }

          code="$(curl -sS -o /tmp/vedic-anon.json -w '%{http_code}' "$ARI/api/identity/vedic-profile")"
          test "$code" = 401
          grep -q 'AUTH_REQUIRED' /tmp/vedic-anon.json

          code="$(curl -sS -o /tmp/anon.json -w '%{http_code}' -H 'content-type: application/json' -d '{"intent":"deny anonymous execution","capability":"thoth","module":"mercury","request_id":"ga-anon"}' "$ARI/api/runtime")"
          test "$code" = 401

          ARI="$ARI" node scripts/prove-device-fabric.mjs
          echo 'PASS live hardened ARI and authenticated Vedic profile endpoint.'

      - name: Record honest GA-candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const device=JSON.parse(fs.readFileSync('DEVICE_FABRIC_RELEASE_PROOF.json','utf8'));
          const evidence={release:'ga-candidate',backend_commit:process.env.GITHUB_SHA,cloud_run_revision:process.env.CLOUD_RUN_REVISION,verified_at:new Date().toISOString(),checks:{backend_clean_install:true,secret_manager:true,session_auth:true,gid:true,vedic_onboarding_api:true,neon_persistence:true,cors_hardened:true,security_headers_hardened:true,distributed_rate_limit:true,device_enrollment:device.checks.cryptographic_enrollment===true,device_isolation:device.checks.gid_isolation===true,device_revocation:device.checks.revocation===true,device_grants:device.checks.explicit_grant===true,replay_protection:device.checks.request_replay_rejected===true,bad_signature_rejected:device.checks.bad_signature_rejected===true,stripe_lifecycle:false}};
          fs.writeFileSync('GA_RELEASE_EVIDENCE.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          cat GA_RELEASE_EVIDENCE.json

      - name: Commit verified release evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVICE_FABRIC_RELEASE_PROOF.json GA_RELEASE_EVIDENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'THOTH: record Vedic ARI GA-candidate evidence'
          git pull --rebase origin main
          git push origin HEAD:main
