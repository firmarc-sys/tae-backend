name: Deploy ARI to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'credential-gateway.js'
      - 'authorization-gateway.js'
      - 'production-gateway.js'
      - 'billing-gateway.js'
      - 'subscription-entitlement-gateway.js'
      - 'secure-gateway.js'
      - 'device-fabric.js'
      - 'server.js'
      - 'neon-runtime-gateway.js'
      - 'neon-store.js'
      - 'manifest-runtime-gateway.js'
      - 'identity-runtime-gateway.js'
      - 'vedic-gateway.js'
      - 'vedic-profile.js'
      - 'scripts/verify-credential-gate.mjs'
      - 'scripts/prove-device-fabric.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/deploy-ari-cloud-run-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-ari-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: ari

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical TAE backend
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: MA'AT source gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          grep -q '"start": "node credential-gateway.js"' package.json
          grep -q 'pathname === "/api/identity/authorize"' credential-gateway.js
          grep -q 'CREDENTIAL_REQUIRED' credential-gateway.js
          grep -q 'row.status !== "active"' credential-gateway.js
          grep -q 'ensureDeviceFabricSchema' secure-gateway.js
          grep -q 'REPLAY_REJECTED' device-fabric.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify production authority bindings
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/current.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/current.json'))
          env={}
          for c in obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              for item in c.get('env',[]) or []:
                  env[item.get('name')]=item
          required_secret_groups=[
              ('ARI session', ['ARI_SESSION_SECRET']),
              ('Neon identity', ['NEON_DATABASE_URL','DATABASE_URL']),
              ('Supabase credential', ['SUPABASE_SECRET_KEY','SUPABASE_SERVICE_ROLE_KEY']),
              ('Prime credential', ['OWNER_ACCESS_CODE','SIOS_OWNER_ACCESS_CODE']),
              ('Stripe secret', ['STRIPE_SECRET_KEY']),
              ('Stripe webhook', ['STRIPE_WEBHOOK_SECRET']),
          ]
          for label,names in required_secret_groups:
              found=False
              for name in names:
                  item=env.get(name) or {}
                  ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef')
                  if ref:
                      found=True
                      break
              if not found:
                  raise SystemExit(f'Missing Secret Manager binding for {label}: one of {names}')
          supabase_url=(env.get('SUPABASE_URL') or {}).get('value')
          if not supabase_url:
              raise SystemExit('SUPABASE_URL is required for the credential authority')
          print('PASS production identity, billing, and session authorities are bound without browser secrets')
          PY

      - name: Configure Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null

      - name: Build and push reproducible ARI image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy credential-gated ARI revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --command=node \
            --args=credential-gateway.js \
            --update-env-vars="NODE_ENV=production,ARI_REQUIRE_AUTH=true,JAHORIN_FREE_ACCESS=false" \
            --quiet
          CREATED="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestCreatedRevisionName)')"
          READY="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$CREATED"
          test "$CREATED" = "$READY"
          echo "CLOUD_RUN_REVISION=$READY" >> "$GITHUB_ENV"

      - name: Prove public credential boundary and runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?release=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = 200 ] && node -e "const j=require('/tmp/ready.json'); if(!(j.ok===true&&j.auth_required===true&&j.auth_configured===true&&j.provider_configured===true)) process.exit(1)"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1 || { cat /tmp/ready.json >&2 || true; exit 1; }

          curl -fsS "$ARI/api/credential-edge" > /tmp/credential-edge.json
          node -e "const j=require('/tmp/credential-edge.json'); if(!(j.ok===true&&j.credential_gate==='gid-proof-v1')) process.exit(1)"

          gid_only="$(curl -sS -o /tmp/gid-only.json -w '%{http_code}' -H 'content-type: application/json' -d '{"gid":"399152573423"}' "$ARI/api/identity/authorize")"
          test "$gid_only" = 400
          node -e "const j=require('/tmp/gid-only.json'); if(j.code!=='CREDENTIAL_REQUIRED'||j.authenticated!==false) process.exit(1)"

          wrong="$(curl -sS -o /tmp/wrong.json -w '%{http_code}' -H 'content-type: application/json' -d '{"gid":"399152573423","credential":"definitely-not-valid"}' "$ARI/api/identity/authorize")"
          test "$wrong" = 401
          node -e "const j=require('/tmp/wrong.json'); if(j.code!=='CREDENTIAL_NOT_AUTHORIZED'||j.authenticated!==false) process.exit(1)"

          vedic="$(curl -sS -o /tmp/vedic-anon.json -w '%{http_code}' "$ARI/api/identity/vedic-profile")"
          test "$vedic" = 401
          runtime="$(curl -sS -o /tmp/anon-runtime.json -w '%{http_code}' -H 'content-type: application/json' -d '{"intent":"deny anonymous execution","capability":"scribe","request_id":"maat-anon"}' "$ARI/api/runtime")"
          test "$runtime" = 401
          echo 'PASS live ARI rejects identifier-only authentication and anonymous execution.'

      - name: Prove private-device authorization
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app" node scripts/prove-device-fabric.mjs

      - name: Record honest GA-candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const prior=fs.existsSync('GA_RELEASE_EVIDENCE.json')?JSON.parse(fs.readFileSync('GA_RELEASE_EVIDENCE.json','utf8')):{};
          const device=JSON.parse(fs.readFileSync('DEVICE_FABRIC_RELEASE_PROOF.json','utf8'));
          const evidence={...prior,release:'ga-candidate',backend_commit:process.env.GITHUB_SHA,cloud_run_revision:process.env.CLOUD_RUN_REVISION,verified_at:new Date().toISOString(),checks:{...(prior.checks||{}),backend_clean_install:true,credential_gate:true,gid_identifier_only_rejected:true,session_auth:true,gid:true,vedic_onboarding_api:true,neon_persistence:true,device_enrollment:device.checks.cryptographic_enrollment===true,device_isolation:device.checks.gid_isolation===true,device_revocation:device.checks.revocation===true,device_grants:device.checks.explicit_grant===true,replay_protection:device.checks.request_replay_rejected===true,bad_signature_rejected:device.checks.bad_signature_rejected===true,stripe_lifecycle:(prior.checks||{}).stripe_lifecycle===true}};
          fs.writeFileSync('GA_RELEASE_EVIDENCE.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          cat GA_RELEASE_EVIDENCE.json

      - name: Commit verified release evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVICE_FABRIC_RELEASE_PROOF.json GA_RELEASE_EVIDENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MAAT: record credential-gated ARI release evidence'
          git pull --rebase origin main
          git push origin HEAD:main
