name: Deploy ARI to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'credential-gateway.js'
      - 'authorization-gateway.js'
      - 'production-gateway.js'
      - 'billing-gateway.js'
      - 'subscription-entitlement-gateway.js'
      - 'universal-capability-gateway.js'
      - 'capability-fabric.js'
      - 'secure-gateway.js'
      - 'device-fabric.js'
      - 'control-plane-gateway.js'
      - 'server.js'
      - 'thoth-voice.js'
      - 'vertex-model-registry.js'
      - 'vertex-model-router.js'
      - 'neon-runtime-gateway.js'
      - 'neon-store.js'
      - 'manifest-runtime-gateway.js'
      - 'identity-runtime-gateway.js'
      - 'vedic-gateway.js'
      - 'vedic-profile.js'
      - 'scripts/normalize-gateway-startup.mjs'
      - 'scripts/enforce-vertex-model-policy.mjs'
      - 'scripts/verify-vertex-model-policy.mjs'
      - 'scripts/verify-credential-gate.mjs'
      - 'scripts/verify-deploy-authority.mjs'
      - 'scripts/prove-device-fabric.mjs'
      - 'scripts/prove-real-stripe-lifecycle.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.env.example'
      - '.github/workflows/deploy-ari-cloud-run-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-ari-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: ari
  SESSION_SECRET: ari-session-secret
  OWNER_ACCESS_CODE_SECRET: ari-owner-access-code
  NEON_DATABASE_SECRET: ari-neon-database-url
  SUPABASE_SERVER_SECRET: ari-supabase-secret-key
  STRIPE_SECRET: ari-stripe-secret-key
  STRIPE_WEBHOOK_SECRET: ari-stripe-webhook-secret
  SUPABASE_URL: https://zrkkilsynurpgwrijicq.supabase.co
  VERTEX_LOCATION: global
  VERTEX_APPROVED_ROUTING_LOCATIONS: global

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical TAE backend
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: MA'AT source gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          node --check scripts/prove-real-stripe-lifecycle.mjs
          node -e "import('astronomy-engine').then(()=>import('tz-lookup')).then(()=>import('./vedic-profile.js')).then(()=>console.log('PASS Vedic runtime imports'))"
          grep -q '"start": "node credential-gateway.js"' package.json
          grep -q 'pathname === "/api/identity/authorize"' credential-gateway.js
          grep -q 'CREDENTIAL_REQUIRED' credential-gateway.js
          grep -q 'if (gid === OWNER_GID)' credential-gateway.js
          grep -q 'row.status !== "active"' credential-gateway.js
          grep -q 'ensureDeviceFabricSchema' secure-gateway.js
          grep -q 'REPLAY_REJECTED' device-fabric.js
          grep -Fq "SUPABASE_URL=$SUPABASE_URL" .env.example
          [[ "$SUPABASE_URL" == https://*.supabase.co ]]
          grep -Fq "ARI_SESSION_SECRET=secret_manager:$SESSION_SECRET" .env.example
          grep -Fq "OWNER_ACCESS_CODE=secret_manager:$OWNER_ACCESS_CODE_SECRET" .env.example
          grep -Fq "NEON_DATABASE_URL=secret_manager:$NEON_DATABASE_SECRET" .env.example
          grep -Fq "SUPABASE_SECRET_KEY=secret_manager:$SUPABASE_SERVER_SECRET" .env.example
          grep -Fq "STRIPE_SECRET_KEY=secret_manager:$STRIPE_SECRET" .env.example
          grep -Fq "STRIPE_WEBHOOK_SECRET=secret_manager:$STRIPE_WEBHOOK_SECRET" .env.example
          echo 'PASS canonical production authority names are source-controlled without secret values.'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify canonical Secret Manager authorities
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null
          for item in \
            "ARI session|$SESSION_SECRET" \
            "Prime credential|$OWNER_ACCESS_CODE_SECRET" \
            "Neon identity|$NEON_DATABASE_SECRET" \
            "Supabase credential|$SUPABASE_SERVER_SECRET" \
            "Stripe secret|$STRIPE_SECRET" \
            "Stripe webhook|$STRIPE_WEBHOOK_SECRET"; do
            label="${item%%|*}"
            secret="${item#*|}"
            gcloud secrets describe "$secret" --project="$GCP_PROJECT_ID" >/dev/null || { echo "Missing canonical Secret Manager secret for $label: $secret" >&2; exit 1; }
            version="$(gcloud secrets versions list "$secret" --project="$GCP_PROJECT_ID" --filter='state=ENABLED' --limit=1 --sort-by='~createTime' --format='value(name)')"
            test -n "$version" || { echo "No enabled Secret Manager version for $label: $secret" >&2; exit 1; }
            echo "PASS $label authority has an enabled Secret Manager version: $secret"
          done

      - name: Rotate live Stripe webhook authority for requested real lifecycle proof
        if: ${{ hashFiles('MAAT_REAL_STRIPE_LIFECYCLE_REQUEST.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud secrets versions access latest --secret="$STRIPE_SECRET" --project="$GCP_PROJECT_ID" > /tmp/stripe-secret-key
          gcloud secrets versions access latest --secret="$NEON_DATABASE_SECRET" --project="$GCP_PROJECT_ID" > /tmp/neon-database-url
          test -s /tmp/stripe-secret-key
          test -s /tmp/neon-database-url
          STRIPE_SECRET_KEY_FILE=/tmp/stripe-secret-key \
          NEON_DATABASE_URL_FILE=/tmp/neon-database-url \
            node scripts/prove-real-stripe-lifecycle.mjs rotate
          test -s /tmp/new-stripe-webhook-secret
          gcloud secrets versions add "$STRIPE_WEBHOOK_SECRET" \
            --project="$GCP_PROJECT_ID" \
            --data-file=/tmp/new-stripe-webhook-secret \
            --quiet >/dev/null
          echo 'REAL_STRIPE_LIFECYCLE_REQUESTED=true' >> "$GITHUB_ENV"
          echo 'PASS rotated Stripe signing authority directly into Secret Manager without exposing it.'

      - name: Configure Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null

      - name: Build and push reproducible ARI image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy credential-gated ARI revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --command=node \
            --args=credential-gateway.js \
            --remove-env-vars="GEMINI_API_KEY,GEMINI_RUNTIME_API_KEY,GOOGLE_API_KEY,THOTH_GEMINI_API_KEY" \
            --update-env-vars="NODE_ENV=production,ARI_REQUIRE_AUTH=true,JAHORIN_FREE_ACCESS=false,SUPABASE_URL=${SUPABASE_URL},GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GOOGLE_CLOUD_LOCATION=${VERTEX_LOCATION},VERTEX_LOCATION=${VERTEX_LOCATION},GOOGLE_GENAI_USE_VERTEXAI=true,VERTEX_APPROVED_ROUTING_LOCATIONS=${VERTEX_APPROVED_ROUTING_LOCATIONS},VERTEX_APPROVE_PREVIEW_REASONING=false,VERTEX_APPROVE_PREVIEW_VIDEO=false,VERTEX_APPROVE_PREVIEW_AUDIO=false,VERTEX_LOG_IDENTITY_REFERENCES=false" \
            --update-secrets="ARI_SESSION_SECRET=${SESSION_SECRET}:latest,OWNER_ACCESS_CODE=${OWNER_ACCESS_CODE_SECRET}:latest,NEON_DATABASE_URL=${NEON_DATABASE_SECRET}:latest,SUPABASE_SECRET_KEY=${SUPABASE_SERVER_SECRET}:latest,STRIPE_SECRET_KEY=${STRIPE_SECRET}:latest,STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}:latest" \
            --quiet

          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --to-latest \
            --quiet

          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/deployed.json
          python3 - <<'PY'
          import json, os
          obj=json.load(open('/tmp/deployed.json'))
          status=obj.get('status',{})
          created=status.get('latestCreatedRevisionName')
          ready=status.get('latestReadyRevisionName')
          if not created or created != ready:
              raise SystemExit(f'latest revision is not ready: created={created} ready={ready}')
          traffic=status.get('traffic') or []
          live=sum(int(x.get('percent') or 0) for x in traffic if x.get('revisionName') == ready or x.get('latestRevision') is True)
          if live != 100:
              raise SystemExit(f'latest revision does not have 100% traffic: ready={ready} traffic={traffic}')
          c=(obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers') or [{}])[0]
          if (c.get('command') or []) != ['node'] or (c.get('args') or []) != ['credential-gateway.js']:
              raise SystemExit(f'wrong public edge command: {c.get("command")} {c.get("args")}')
          env={item.get('name'):item for item in c.get('env',[]) or []}
          forbidden=['GEMINI_API_KEY','GEMINI_RUNTIME_API_KEY','GOOGLE_API_KEY','THOTH_GEMINI_API_KEY']
          present=[name for name in forbidden if name in env]
          if present:
              raise SystemExit(f'legacy provider credentials remain after deployment: {present}')
          for name in ['ARI_SESSION_SECRET','OWNER_ACCESS_CODE','NEON_DATABASE_URL','SUPABASE_SECRET_KEY','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET']:
              item=env.get(name) or {}
              ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef')
              if not ref:
                  raise SystemExit(f'{name} is not a Secret Manager reference after deployment')
          supabase_url=(env.get('SUPABASE_URL') or {}).get('value')
          if supabase_url != os.environ['SUPABASE_URL']:
              raise SystemExit(f'SUPABASE_URL drift after deployment: {supabase_url!r}')
          expected_vertex={
              'GOOGLE_CLOUD_PROJECT':os.environ['GCP_PROJECT_ID'],
              'GOOGLE_CLOUD_LOCATION':os.environ['VERTEX_LOCATION'],
              'VERTEX_LOCATION':os.environ['VERTEX_LOCATION'],
              'GOOGLE_GENAI_USE_VERTEXAI':'true',
              'VERTEX_APPROVED_ROUTING_LOCATIONS':os.environ['VERTEX_APPROVED_ROUTING_LOCATIONS'],
          }
          for name,value in expected_vertex.items():
              actual=(env.get(name) or {}).get('value')
              if actual != value:
                  raise SystemExit(f'{name} drift after deployment: expected={value!r} actual={actual!r}')
          print('PASS credential-gateway.js is the sole public ARI edge with 100% traffic')
          print('PASS all session, identity, Supabase and Stripe authorities are Secret Manager backed')
          print('PASS canonical Supabase compatibility URL is present on the live revision')
          print('PASS legacy Developer API credentials are absent from the live revision')
          print('PASS Vertex project, location and routing policy are explicit on the live revision')
          print('REVISION', ready)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'CLOUD_RUN_REVISION={ready}\n')
          PY

      - name: Prove public credential boundary and runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?release=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = 200 ] && node -e "const j=require('/tmp/ready.json'); if(!(j.ok===true&&j.auth_required===true&&j.auth_configured===true&&j.provider_configured===true&&j.provider==='google-vertex-ai'&&j.neon_ready===true)) process.exit(1)"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1 || { cat /tmp/ready.json >&2 || true; exit 1; }

          curl -fsS "$ARI/api/credential-edge" > /tmp/credential-edge.json
          node -e "const j=require('/tmp/credential-edge.json'); if(!(j.ok===true&&j.credential_gate==='gid-proof-v2'&&j.owner_access==='canonical-gid')) process.exit(1)"

          owner="$(curl -sS -c /tmp/owner.cookies -o /tmp/owner-authorize.json -w '%{http_code}' -H 'content-type: application/json' -d '{"gid":"399152573423"}' "$ARI/api/identity/authorize")"
          test "$owner" = 200
          owner_identity="$(curl -sS -b /tmp/owner.cookies -o /tmp/owner-identity.json -w '%{http_code}' "$ARI/api/identity")"
          test "$owner_identity" = 200
          node -e "const j=require('/tmp/owner-identity.json'); if(String(j.gid||'')!=='399152573423') process.exit(1)"

          member_missing="$(curl -sS -o /tmp/member-missing.json -w '%{http_code}' -H 'content-type: application/json' -d '{"gid":"000000000000"}' "$ARI/api/identity/authorize")"
          test "$member_missing" = 400
          node -e "const j=require('/tmp/member-missing.json'); if(j.code!=='CREDENTIAL_REQUIRED'||j.authenticated!==false) process.exit(1)"

          vedic="$(curl -sS -o /tmp/vedic-anon.json -w '%{http_code}' "$ARI/api/identity/vedic-profile")"
          test "$vedic" = 401
          runtime="$(curl -sS -o /tmp/anon-runtime.json -w '%{http_code}' -H 'content-type: application/json' -d '{"intent":"deny anonymous execution","capability":"scribe","request_id":"maat-anon"}' "$ARI/api/runtime")"
          test "$runtime" = 401
          echo 'PASS live ARI authorizes the canonical Prime Orchestrator GID, requires member credentials, and rejects anonymous execution.'

      - name: Prove private-device authorization
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app" node scripts/prove-device-fabric.mjs

      - name: Prove real Stripe Customer and Subscription lifecycle into Neon
        if: ${{ env.REAL_STRIPE_LIFECYCLE_REQUESTED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          STRIPE_SECRET_KEY_FILE=/tmp/stripe-secret-key \
          NEON_DATABASE_URL_FILE=/tmp/neon-database-url \
            node scripts/prove-real-stripe-lifecycle.mjs verify
          node -e "const p=require('./STRIPE_LIFECYCLE_PROOF.json'); if(!(p.ok===true&&p.real_stripe_object_lifecycle===true&&p.no_payment_capture===true&&p.stripe_status_after_cancel==='canceled')) process.exit(1)"
          echo 'STRIPE_LIFECYCLE_VERIFIED=true' >> "$GITHUB_ENV"
          echo 'PASS real live Stripe Customer -> Subscription -> signed webhook -> Neon -> cancellation lifecycle.'

      - name: Remove ephemeral billing authorities from runner
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          for file in /tmp/stripe-secret-key /tmp/neon-database-url /tmp/new-stripe-webhook-secret /tmp/new-stripe-webhook-endpoint-id /tmp/real-stripe-rotation.json; do
            if [ -f "$file" ]; then
              if command -v shred >/dev/null 2>&1; then shred -u "$file"; else rm -f "$file"; fi
            fi
          done
          exit 0

      - name: Record honest GA evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const prior=fs.existsSync('GA_RELEASE_EVIDENCE.json')?JSON.parse(fs.readFileSync('GA_RELEASE_EVIDENCE.json','utf8')):{};
          const device=JSON.parse(fs.readFileSync('DEVICE_FABRIC_RELEASE_PROOF.json','utf8'));
          const stripeLifecycle=process.env.STRIPE_LIFECYCLE_VERIFIED==='true'||(prior.checks||{}).stripe_lifecycle===true;
          const checks={...(prior.checks||{}),backend_clean_install:true,credential_gate:true,prime_owner_gid_authorized:true,member_credential_required:true,session_auth:true,gid:true,vedic_onboarding_api:true,neon_persistence:true,device_enrollment:device.checks.cryptographic_enrollment===true,device_isolation:device.checks.gid_isolation===true,device_revocation:device.checks.revocation===true,device_grants:device.checks.explicit_grant===true,replay_protection:device.checks.request_replay_rejected===true,bad_signature_rejected:device.checks.bad_signature_rejected===true,stripe_lifecycle:stripeLifecycle,vertex_only_runtime:true,legacy_provider_credentials_absent:true};
          delete checks.gid_identifier_only_rejected;
          const required=['backend_clean_install','credential_gate','prime_owner_gid_authorized','member_credential_required','session_auth','gid','vedic_onboarding_api','neon_persistence','device_enrollment','device_isolation','device_revocation','device_grants','replay_protection','bad_signature_rejected','stripe_lifecycle','vertex_only_runtime','legacy_provider_credentials_absent'];
          const gaReady=required.every((key)=>checks[key]===true);
          const evidence={...prior,release:gaReady?'ga':'ga-candidate',ga_status:gaReady?'VERIFIED':'BLOCKED',backend_commit:process.env.GITHUB_SHA,cloud_run_revision:process.env.CLOUD_RUN_REVISION,verified_at:new Date().toISOString(),checks};
          fs.writeFileSync('GA_RELEASE_EVIDENCE.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          cat GA_RELEASE_EVIDENCE.json

      - name: Commit verified release evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVICE_FABRIC_RELEASE_PROOF.json GA_RELEASE_EVIDENCE.json
          if [ "${STRIPE_LIFECYCLE_VERIFIED:-false}" = "true" ]; then
            git add STRIPE_LIFECYCLE_PROOF.json
            git rm -f MAAT_REAL_STRIPE_LIFECYCLE_REQUEST.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MAAT: record verified ARI GA release evidence'
          git pull --rebase origin main
          git push origin HEAD:main
