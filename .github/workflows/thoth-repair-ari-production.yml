name: THOTH Repair ARI Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thoth-repair-ari-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thoth-repair-ari-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/689058655022/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@project-7e6f2720-0291-4c91-8c3.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-7e6f2720-0291-4c91-8c3

      - name: Wait for source deploy image for this commit
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-7e6f2720-0291-4c91-8c3'
          REGION='us-west1'
          SERVICE='ari'
          found=0
          for attempt in $(seq 1 90); do
            image="$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(spec.template.spec.containers[0].image)' || true)"
            echo "attempt=$attempt image=${image##*/}"
            if [[ "$image" == *":${GITHUB_SHA}" ]]; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1 || { echo 'Timed out waiting for source-deployed image for this commit' >&2; exit 1; }

      - name: Safely normalize Neon connection secret when permitted
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-7e6f2720-0291-4c91-8c3'
          SECRET='ari-neon-database-url'
          CURRENT=/tmp/neon-current
          FIXED=/tmp/neon-fixed
          if ! gcloud secrets versions access latest --secret="$SECRET" --project="$PROJECT" > "$CURRENT" 2>/tmp/neon-access-error; then
            echo 'Secret accessor is not granted to the deploy identity; retaining existing Neon secret value.'
            exit 0
          fi
          chmod 600 "$CURRENT"
          NEON_TARGET_HOST='ep-fragrant-recipe-ak4pobky-pooler.c-3.us-west-2.aws.neon.tech' node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/neon-current','utf8').trim();
          const u = new URL(raw);
          u.hostname = process.env.NEON_TARGET_HOST;
          if (!u.pathname || u.pathname === '/') u.pathname = '/neondb';
          u.searchParams.set('sslmode','require');
          u.searchParams.set('channel_binding','require');
          fs.writeFileSync('/tmp/neon-fixed', u.toString() + '\n', { mode: 0o600 });
          console.log(`Neon secret normalized for host=${u.hostname} db=${u.pathname.slice(1)} sslmode=${u.searchParams.get('sslmode')} channel_binding=${u.searchParams.get('channel_binding')}`);
          NODE
          if cmp -s "$CURRENT" "$FIXED"; then
            echo 'Neon secret already normalized.'
            exit 0
          fi
          if gcloud secrets versions add "$SECRET" --project="$PROJECT" --data-file="$FIXED" >/dev/null 2>/tmp/neon-write-error; then
            echo 'Added a normalized Neon connection secret version.'
          else
            echo 'Deploy identity cannot add secret versions; retaining existing secret value.'
          fi
          rm -f "$CURRENT" "$FIXED"

      - name: Restore credential gateway and proven secret bindings
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-7e6f2720-0291-4c91-8c3'
          REGION='us-west1'
          SERVICE='ari'
          gcloud run services update "$SERVICE" \
            --project="$PROJECT" \
            --region="$REGION" \
            --command=node \
            --args=credential-gateway.js \
            --update-env-vars='NODE_ENV=production,ARI_REQUIRE_AUTH=true,JAHORIN_FREE_ACCESS=false,NEON_POOL_MAX=5,PRODUCTION_ALLOWED_ORIGINS=https://jahorin.space\,https://www.jahorin.space\,https://jahorin-ga.vercel.app\,https://siaas.space\,https://www.siaas.space\,https://siaas.netlify.app\,https://main--siaas.netlify.app,SUPABASE_URL=https://zrkkilsynurpgwrijicq.supabase.co' \
            --update-secrets='ARI_SESSION_SECRET=ari-session-secret:latest,OWNER_ACCESS_CODE=OWNER_ACCESS_CODE:latest,NEON_DATABASE_URL=ari-neon-database-url:latest,SUPABASE_SECRET_KEY=SUPABASE_SECRET_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEYy:latest,STRIPE_WEBHOOK_SECRET=ari-stripe-webhook-secret:latest' \
            --quiet
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT" --region="$REGION" --to-latest --quiet

      - name: Prove live ARI and Jahorin GID boundary
        shell: bash
        run: |
          set -euo pipefail
          ARI='https://ari-689058655022.us-west1.run.app'
          JAHORIN='https://jahorin.space'
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?thoth-repair=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = 200 ]; then
              ready=1
              break
            fi
            echo "ready attempt=$attempt http=$code body=$(head -c 300 /tmp/ready.json 2>/dev/null || true)"
            sleep 5
          done
          test "$ready" = 1 || { echo 'ARI did not become ready' >&2; cat /tmp/ready.json >&2 || true; exit 1; }
          cat /tmp/ready.json

          edge="$(curl -sS -o /tmp/edge.json -w '%{http_code}' "$ARI/api/credential-edge")"
          test "$edge" = 200
          node -e "const j=require('/tmp/edge.json'); if(!(j.ok===true&&j.credential_gate==='gid-proof-v1')) process.exit(1)"

          session="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$JAHORIN/api/identity/session?thoth-repair=$GITHUB_SHA")"
          test "$session" = 200
          node -e "const j=require('/tmp/session.json'); if(j.ok!==true||j.authenticated!==false) process.exit(1)"

          invalid="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -H 'content-type: application/json' -d '{\"gid\":\"123\"}' "$JAHORIN/api/identity/authorize")"
          test "$invalid" = 400
          node -e "const j=require('/tmp/invalid.json'); if(j.code!=='INVALID_GID') process.exit(1)"
          echo 'PASS Jahorin -> Vercel -> credential-gated ARI -> Neon GID boundary is live.'
