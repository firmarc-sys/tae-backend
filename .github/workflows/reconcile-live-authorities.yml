name: Reconcile Live ARI Authorities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-live-authorities.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install locked runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Enforce Vertex-only provider registry
        shell: bash
        run: |
          set -euo pipefail
          export NEON_DATABASE_URL="$(gcloud secrets versions access latest --secret=ari-neon-database-url --project="$GCP_PROJECT_ID")"
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Pool } = pg;
          const pool = new Pool({ connectionString: process.env.NEON_DATABASE_URL, max: 1, connectionTimeoutMillis: 10000 });
          try {
            await pool.query(`
              update public.provider_routes
              set enabled=false, updated_at=now()
              where enabled=true and provider <> 'google-vertex-ai'
            `);
            const proof = await pool.query(`
              select provider, count(*)::int as routes
              from public.provider_routes
              where enabled=true
              group by provider
              order by provider
            `);
            if (!proof.rows.length) throw new Error('No enabled Vertex provider routes remain');
            if (proof.rows.some((row) => row.provider !== 'google-vertex-ai')) {
              throw new Error(`Non-Vertex provider remains enabled: ${JSON.stringify(proof.rows)}`);
            }
            console.log(`PASS Vertex-only provider registry: ${JSON.stringify(proof.rows)}`);
          } finally {
            await pool.end();
          }
          NODE
          unset NEON_DATABASE_URL

      - name: Canonicalize existing Stripe Secret Manager authority without exposing value
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='ari-stripe-key'
          TARGET='ari-stripe-secret-key'
          gcloud secrets describe "$SOURCE" --project="$GCP_PROJECT_ID" >/dev/null
          if ! gcloud secrets describe "$TARGET" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create "$TARGET" --project="$GCP_PROJECT_ID" --replication-policy=automatic >/dev/null
          fi
          if ! gcloud secrets versions list "$TARGET" --project="$GCP_PROJECT_ID" --filter='state=ENABLED' --format='value(name)' | grep -q .; then
            gcloud secrets versions access latest --secret="$SOURCE" --project="$GCP_PROJECT_ID" \
              | gcloud secrets versions add "$TARGET" --project="$GCP_PROJECT_ID" --data-file=- >/dev/null
          fi
          echo 'PASS canonical Stripe Secret Manager authority present'

      - name: Verify Vertex-only live readiness read-only
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          code="$(curl -sS --connect-timeout 5 --max-time 30 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?reconcile=${GITHUB_SHA}" || true)"
          test "$code" = '200' || { cat /tmp/ready.json >&2 || true; exit 1; }
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/ready.json'))
          ok=(body.get('ok') is True and body.get('provider') == 'google-vertex-ai' and body.get('provider_configured') is True and body.get('mercury_runtime_ready') is True)
          if not ok:
              print(body)
              raise SystemExit(1)
          PY
          echo 'PASS live ARI is reconciled on google-vertex-ai only'
