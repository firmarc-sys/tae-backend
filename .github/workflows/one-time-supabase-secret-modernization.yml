name: one-time-supabase-secret-modernization

on:
  push:
    branches: [thoth/supabase-secret-key-modernization]
    paths:
      - .github/workflows/one-time-supabase-secret-modernization.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/supabase-secret-key-modernization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/patch_supabase_secret_key.py
      - run: node --check server.js
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .env.example
          git commit -m "Support modern Supabase server secret keys"
          git push origin HEAD:thoth/supabase-secret-key-modernization
