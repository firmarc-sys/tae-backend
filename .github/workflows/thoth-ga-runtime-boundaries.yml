name: THOTH GA Runtime Boundaries

on:
  push:
    branches:
      - thoth/ga-runtime-boundaries
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/ga-runtime-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch production boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          server=Path('server.js')
          s=server.read_text()
          old='const geminiApiKey = process.env.GEMINI_API_KEY || process.env.GOOGLE_API_KEY || "";\nconst geminiModel = process.env.GEMINI_MODEL || process.env.GEMINI_DEFAULT_MODEL || "gemini-2.5-flash";'
          new='const runtimeGeminiApiKey = process.env.GEMINI_RUNTIME_API_KEY || process.env.GOOGLE_API_KEY || "";\nconst thothGeminiApiKey = process.env.THOTH_GEMINI_API_KEY || process.env.GEMINI_API_KEY || runtimeGeminiApiKey;\nconst geminiApiKey = runtimeGeminiApiKey;\nconst geminiModel = process.env.GEMINI_MODEL || process.env.GEMINI_DEFAULT_MODEL || (runtimeGeminiApiKey ? "gemini-3.6-flash" : "gemini-2.5-flash");'
          if old in s: s=s.replace(old,new,1)
          s=s.replace('installThothVoiceRoutes(app, { apiKey: geminiApiKey, authorize: requireProviderAccess });','installThothVoiceRoutes(app, { apiKey: thothGeminiApiKey, authorize: requireProviderAccess });',1)
          s=s.replace('thothVoiceReadiness(geminiApiKey)','thothVoiceReadiness(thothGeminiApiKey)')
          server.write_text(s)

          gateway=Path('secure-gateway.js')
          g=gateway.read_text()
          anchor='const sessionSecret = process.env.ARI_SESSION_SECRET || (legacyJwtSecret && legacyJwtSecret !== "CHANGE-ME-IN-PROD" ? legacyJwtSecret : "");\n'
          if 'const authRequired =' not in g:
              assert anchor in g
              g=g.replace(anchor,anchor+'const authRequired = !/^(0|false|no|off)$/i.test(process.env.ARI_REQUIRE_AUTH || "true");\n',1)
          anchor='function originFor(req) {\n'
          helper='function hasExecutionAuthMaterial(req) {\n  if (sessionGid(req)) return true;\n  return /^Bearer\\s+\\S+/i.test(String(req.headers.authorization || ""));\n}\n\nfunction requiresExecutionAuth(pathname, method) {\n  if (String(method || "GET").toUpperCase() !== "POST") return false;\n  return new Set(["/api/runtime", "/runtime", "/api/tae", "/tae", "/api/generate", "/generate"]).has(pathname);\n}\n\n'
          if 'function hasExecutionAuthMaterial' not in g:
              assert anchor in g
              g=g.replace(anchor,helper+anchor,1)
          old='    if (!(await enforceRequestRate(req, res, pathname, id))) return;\n\n    if (isDeviceRoute(pathname)) {'
          if old in g:
              g=g.replace(old,'    if (authRequired && requiresExecutionAuth(pathname, req.method) && !hasExecutionAuthMaterial(req)) {\n      return json(res, 401, { ok: false, status: "denied", code: "AUTH_REQUIRED", error: "Authenticated ARI session required", request_id: id }, id, {}, req);\n    }\n\n    if (!(await enforceRequestRate(req, res, pathname, id))) return;\n\n    if (isDeviceRoute(pathname)) {',1)
          gateway.write_text(g)

          package=Path('package.json')
          p=json.loads(package.read_text())
          check=p.get('scripts',{}).get('check','')
          if 'thoth-voice.js' not in check: p['scripts']['check']=check+' && node --check thoth-voice.js'
          package.write_text(json.dumps(p,indent=2)+'\n')
          PY
      - name: Reproducible verification
        run: |
          npm install --package-lock-only
          npm ci
          npm run check
          grep -q 'thothGeminiApiKey' server.js
          grep -q 'hasExecutionAuthMaterial' secure-gateway.js
      - name: Commit verified production source patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'firmarc-sys'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js secure-gateway.js package.json package-lock.json
          git commit -m 'THOTH: isolate voice credential and enforce auth at edge'
          git push origin HEAD:thoth/ga-runtime-boundaries
