name: THOTH DeepSearch patch

on:
  push:
    branches:
      - thoth/deepsearch-backend

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[deepsearch-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/deepsearch-backend
          fetch-depth: 0

      - name: Patch ARI DeepSearch grounding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text()

          old_generate = '''async function generateWithGoogle({ prompt, systemInstruction, temperature = 0.7, image = null }) {
            const client = requireProvider();
            const contents = image ? [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: image.mimeType, data: image.data } }] }] : prompt;
            const response = await client.models.generateContent({ model: geminiModel, contents, config: { systemInstruction, temperature: Math.max(0, Math.min(2, Number(temperature) || 0.7)), maxOutputTokens: 4096 } });
            const text = String(response.text || "").trim();
            if (!text) throw httpError(502, "Google provider returned no generated text.");
            return { text, model: geminiModel, provider, tokens: response.usageMetadata?.totalTokenCount ?? null, usage: response.usageMetadata || null, media_input: image ? { type: "image", mime_type: image.mimeType, bytes: image.bytes } : null };
          }'''

          new_generate = '''function deepSearchRequested(prompt = "") {
            return /\\bDEEPSEARCH MANIFESTATION IS ACTIVE\\b/i.test(String(prompt || ""));
          }

          function groundingSourceDomain(uri = "") {
            try { return new URL(String(uri)).hostname.replace(/^www\\./, "") || null; }
            catch { return null; }
          }

          function normalizeGrounding(response) {
            const metadata = response?.candidates?.[0]?.groundingMetadata || {};
            const researchPaths = Array.isArray(metadata.webSearchQueries)
              ? metadata.webSearchQueries.map((value) => String(value || "").trim()).filter(Boolean)
              : [];
            const chunks = Array.isArray(metadata.groundingChunks) ? metadata.groundingChunks : [];
            const seen = new Set();
            const sources = [];
            for (let index = 0; index < chunks.length; index += 1) {
              const web = chunks[index]?.web || {};
              const url = String(web.uri || "").trim();
              if (!url || seen.has(url)) continue;
              seen.add(url);
              sources.push({
                id: `source-${sources.length + 1}`,
                title: String(web.title || groundingSourceDomain(url) || `Source ${sources.length + 1}`).trim(),
                url,
                domain: groundingSourceDomain(url),
                status: "grounded",
              });
            }
            return {
              research_paths: researchPaths,
              path_count: Math.max(researchPaths.length, sources.length),
              sources,
              citations: sources,
              contradictions: [],
            };
          }

          async function generateWithGoogle({ prompt, systemInstruction, temperature = 0.7, image = null, groundWithSearch = false }) {
            const client = requireProvider();
            const contents = image ? [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: image.mimeType, data: image.data } }] }] : prompt;
            const deepSearch = groundWithSearch || deepSearchRequested(prompt);
            const config = {
              systemInstruction,
              temperature: Math.max(0, Math.min(2, Number(temperature) || 0.7)),
              maxOutputTokens: 4096,
              ...(deepSearch ? { tools: [{ googleSearch: {} }] } : {}),
            };
            const response = await client.models.generateContent({ model: geminiModel, contents, config });
            const text = String(response.text || "").trim();
            if (!text) throw httpError(502, "Google provider returned no generated text.");
            return {
              text,
              model: geminiModel,
              provider,
              tokens: response.usageMetadata?.totalTokenCount ?? null,
              usage: response.usageMetadata || null,
              media_input: image ? { type: "image", mime_type: image.mimeType, bytes: image.bytes } : null,
              deepsearch: deepSearch ? normalizeGrounding(response) : null,
            };
          }'''

          if old_generate not in text:
            raise SystemExit('generateWithGoogle anchor not found')
          text = text.replace(old_generate, new_generate, 1)

          tae_start = text.index('api.post("/tae"')
          runtime_start = text.index('api.post("/runtime"', tae_start)
          tae_block = text[tae_start:runtime_start]

          old_runtime = '''    const runtime = await orchestrateWithMercury(req, {
            capability: "tae",
            intent: prompt,
            requestId: req.body?.request_id || req.requestId,
            payload: req.body || {},
          });'''
          new_runtime = '''    const deepSearch = String(req.body?.mode || "").toLowerCase() === "deepsearch" || deepSearchRequested(prompt);
          const runtime = await orchestrateWithMercury(req, {
            capability: deepSearch ? "interweb" : "tae",
            intent: prompt,
            requestId: req.body?.request_id || req.requestId,
            payload: req.body || {},
          });'''
          if old_runtime not in tae_block:
            raise SystemExit('TAE orchestration anchor not found')
          tae_block = tae_block.replace(old_runtime, new_runtime, 1)

          old_call = '''      temperature: req.body?.temperature,
          });'''
          new_call = '''      temperature: req.body?.temperature,
            groundWithSearch: deepSearch,
          });'''
          if old_call not in tae_block:
            raise SystemExit('TAE provider call anchor not found')
          tae_block = tae_block.replace(old_call, new_call, 1)

          old_reply = '        reply: { kind: "prose", text: result.text, tokens: result.tokens },'
          new_reply = '''        reply: {
              kind: "prose",
              text: result.text,
              tokens: result.tokens,
              ...(result.deepsearch ? {
                sources: result.deepsearch.sources,
                citations: result.deepsearch.citations,
                research_paths: result.deepsearch.research_paths,
                path_count: result.deepsearch.path_count,
                contradictions: result.deepsearch.contradictions,
              } : {}),
            },
            deepsearch: result.deepsearch,'''
          if old_reply not in tae_block:
            raise SystemExit('TAE reply anchor not found')
          tae_block = tae_block.replace(old_reply, new_reply, 1)

          text = text[:tae_start] + tae_block + text[runtime_start:]
          path.write_text(text)
          PY

          node --check server.js

      - name: Commit patched runtime
        shell: bash
        run: |
          if git diff --quiet -- server.js; then
            echo "server.js already patched"
            exit 0
          fi
          git config user.name "THOTH Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "THOTH: enable grounded Wepwawet DeepSearch [deepsearch-patched]"
          git push origin HEAD:thoth/deepsearch-backend
