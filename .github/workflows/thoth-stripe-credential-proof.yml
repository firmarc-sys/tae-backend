name: THOTH Stripe Credential Proof

on:
  push:
    branches: [thoth/stripe-ga-proof-20260826]
    paths:
      - '.github/workflows/thoth-stripe-credential-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve production Stripe secret binding
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/service.json
          python3 - <<'PY' > /tmp/stripe-ref.env
          import json
          j=json.load(open('/tmp/service.json'))
          containers=((j.get('spec',{}).get('template',{}).get('spec',{}).get('containers')) or [])
          for c in containers:
              for item in c.get('env') or []:
                  if item.get('name')!='STRIPE_SECRET_KEY':
                      continue
                  ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef') or {}
                  name=ref.get('name') or ref.get('secret') or ''
                  version=ref.get('key') or ref.get('version') or 'latest'
                  if name:
                      print('STRIPE_SECRET_NAME='+name)
                      print('STRIPE_BOUND_VERSION='+version)
                      raise SystemExit
          raise SystemExit('STRIPE_SECRET_KEY is not bound to Secret Manager')
          PY
          cat /tmp/stripe-ref.env >> "$GITHUB_ENV"
          sed 's/^/resolved_/' /tmp/stripe-ref.env

      - name: Validate bound and latest Stripe credentials read-only
        shell: bash
        run: |
          set -euo pipefail
          bound="$(gcloud secrets versions access "$STRIPE_BOUND_VERSION" --secret="$STRIPE_SECRET_NAME" --project="$GCP_PROJECT_ID")"
          latest="$(gcloud secrets versions access latest --secret="$STRIPE_SECRET_NAME" --project="$GCP_PROJECT_ID")"
          echo "::add-mask::$bound"
          echo "::add-mask::$latest"

          python3 - "$bound" "$latest" <<'PY'
          import hashlib,sys
          for label,value in [('bound',sys.argv[1]),('latest',sys.argv[2])]:
              print(f'{label}_fingerprint='+hashlib.sha256(value.encode()).hexdigest()[:12])
          print('bound_matches_latest='+str(sys.argv[1]==sys.argv[2]).lower())
          PY

          validate() {
            label="$1"; key="$2"
            code="$(curl -sS --max-time 20 -o "/tmp/${label}.json" -w '%{http_code}' -u "${key}:" https://api.stripe.com/v1/balance || true)"
            echo "${label}_http=$code"
            LABEL="$label" HTTP_CODE="$code" python3 - <<'PY'
          import json,os
          p='/tmp/'+os.environ['LABEL']+'.json'
          try: j=json.load(open(p))
          except Exception: j={}
          if os.environ['HTTP_CODE']=='200':
              print(os.environ['LABEL']+'_valid=true')
              print(os.environ['LABEL']+'_livemode='+str(bool(j.get('livemode'))).lower())
          else:
              err=j.get('error') or {}
              print(os.environ['LABEL']+'_valid=false')
              print(os.environ['LABEL']+'_error_type='+str(err.get('type') or 'unknown'))
              print(os.environ['LABEL']+'_error_code='+str(err.get('code') or 'unknown'))
          PY
          }

          validate bound "$bound"
          validate latest "$latest"

          latest_code="$(curl -sS --max-time 20 -o /tmp/latest-final.json -w '%{http_code}' -u "${latest}:" https://api.stripe.com/v1/balance || true)"
          test "$latest_code" = 200
          echo 'PASS updated Stripe credential authenticates with Stripe.'
