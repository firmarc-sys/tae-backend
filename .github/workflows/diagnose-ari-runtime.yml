name: Diagnose ARI Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ari-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/689058655022/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@project-7e6f2720-0291-4c91-8c3.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-7e6f2720-0291-4c91-8c3

      - name: Inspect safe Cloud Run runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-7e6f2720-0291-4c91-8c3'
          REGION='us-west1'
          SERVICE='ari'
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/service.json'))
          status=obj.get('status',{})
          template=obj.get('spec',{}).get('template',{})
          spec=template.get('spec',{})
          c=(spec.get('containers') or [{}])[0]
          print('latestCreatedRevisionName=',status.get('latestCreatedRevisionName'))
          print('latestReadyRevisionName=',status.get('latestReadyRevisionName'))
          print('traffic=',status.get('traffic'))
          print('image=',c.get('image'))
          print('command=',c.get('command'))
          print('args=',c.get('args'))
          print('containerPort=',((c.get('ports') or [{}])[0]).get('containerPort'))
          metadata=template.get('metadata',{}) or {}
          annotations=metadata.get('annotations',{}) or {}
          for key in sorted(annotations):
            if any(token in key.lower() for token in ('client-name','client-version','operation-id','startup','cpu-throttling')):
              print(f'ANNOTATION {key}={annotations[key]}')
          safe_values={
            'NODE_ENV','ARI_REQUIRE_AUTH','JAHORIN_FREE_ACCESS','SIOS_OWNER_GID',
            'CREDENTIAL_GATEWAY_INNER_PORT','AUTHORIZATION_GATEWAY_INNER_PORT',
            'PRODUCTION_GATEWAY_INNER_PORT','BILLING_GATEWAY_INNER_PORT',
            'SUBSCRIPTION_ENTITLEMENT_INNER_PORT','UNIVERSAL_CAPABILITY_INNER_PORT',
            'SECURE_GATEWAY_INNER_PORT','CONTROL_PLANE_INNER_PORT',
            'NEON_GATEWAY_INNER_PORT','ARI_IDENTITY_PORT','ARI_CORE_PORT','ARI_INNER_PORT',
            'PRODUCTION_ALLOWED_ORIGINS','SUPABASE_URL','VERTEX_LOCATION','GOOGLE_CLOUD_PROJECT'
          }
          for item in c.get('env',[]) or []:
            name=item.get('name')
            if name in safe_values:
              print(f'ENV {name}={item.get("value")!r}')
            ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef')
            if ref:
              print(f'SECRET_REF {name} -> {ref.get("name")}:{ref.get("key") or ref.get("version") or "latest"}')
          PY

      - name: Read recent ARI startup logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="ari"' \
            --project='project-7e6f2720-0291-4c91-8c3' \
            --limit=250 \
            --freshness=4h \
            --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' \
            | grep -E -i 'ARI|gateway|ready|readiness|listen|ECONNREFUSED|EADDRINUSE|error|failed|exit|Neon|manifest|identity|control|secure|universal|subscription|billing|production' \
            | tail -n 220 || true
