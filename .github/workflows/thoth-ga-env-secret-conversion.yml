name: THOTH GA Env Secret Conversion

on:
  push:
    branches:
      - thoth/ga-env-secret-conversion
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify vaulted replacements exist
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets versions describe latest --secret=ari-session-secret --project="$GCP_PROJECT_ID" >/dev/null
          gcloud secrets versions describe latest --secret=ari-neon-database-url --project="$GCP_PROJECT_ID" >/dev/null
          echo 'Vaulted replacements verified.'
      - name: Remove plaintext env bindings on a no-traffic revision
        shell: bash
        run: |
          set -euo pipefail
          before="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --remove-env-vars=ARI_SESSION_SECRET,NEON_DATABASE_URL \
            --no-traffic \
            --quiet >/dev/null
          candidate="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestCreatedRevisionName)')"
          ready="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "previous_ready_revision=$before"
          echo "conversion_candidate_revision=$candidate"
          echo "traffic_ready_revision=$ready"
          test -n "$candidate"
      - name: Prove serving traffic remains healthy
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          curl -fsS --max-time 20 "$ARI/api/ready?env-secret-conversion=$(date +%s)" -o ready.json
          node -e "const j=require('./ready.json'); if(!(j.ok===true&&j.auth_required===true&&j.provider_configured===true&&j.thoth_voice_configured===true)) process.exit(1)"
          echo 'Serving ARI remained healthy during no-traffic conversion.'
