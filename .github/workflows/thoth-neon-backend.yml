name: thoth-neon-backend

on:
  push:
    branches: [thoth-neon-migration]
    paths:
      - '.github/workflows/thoth-neon-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth-neon-migration

      - name: Add PostgreSQL runtime dependency
        run: npm install pg@^8.13.1 --save

      - name: Wire Neon persistence into ARI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('server.js')
          s=p.read_text()

          imp='''import { GoogleGenAI } from "@google/genai";'''
          neon_imp='''import { GoogleGenAI } from "@google/genai";
          import {
            neonConfigured,
            neonHealth,
            ensureNeonIdentity,
            getNeonIdentity,
            getTwinState,
            mergeTwinState,
            setTwinPermissions,
            setTwinPreferences,
            recordTwinEvent,
            incrementCapabilityUsage,
            recordPrediction,
            listPredictions,
            resolveLatestPrediction,
            adjustTwinConfidence,
            recordTimeline,
            getTimeline,
            clearTwin,
          } from "./neon-store.js";'''
          if s.count(imp)!=1: raise SystemExit('Google import anchor mismatch')
          s=s.replace(imp,neon_imp,1)

          old='''function responseBase(extra = {}) {
            return {
              ok: true,
              gid: OWNER_GID,
              mode: OWNER_MODE,
              timestamp: new Date().toISOString(),
              ...extra,
            };
          }'''
          new='''function responseBase(extra = {}) {
            return {
              ok: true,
              gid: null,
              mode: "public",
              timestamp: new Date().toISOString(),
              ...extra,
            };
          }'''
          if s.count(old)!=1: raise SystemExit('responseBase anchor mismatch')
          s=s.replace(old,new,1)

          old='''function renderState(state = "idle") {
            return {
              ok: true,
              runtime: "Mercury",
              state,
              alive: true,
              gid: OWNER_GID,
              mode: OWNER_MODE,
              timestamp_ms: Date.now(),
            };
          }'''
          new='''function renderState(state = "idle") {
            return {
              ok: true,
              runtime: "Mercury",
              state,
              alive: true,
              gid: null,
              mode: "public",
              timestamp_ms: Date.now(),
            };
          }'''
          if s.count(old)!=1: raise SystemExit('renderState anchor mismatch')
          s=s.replace(old,new,1)

          marker='''const api = express.Router();'''
          helper='''async function requireTwinGid(req) {
            const gid = sessionGid(req);
            if (!gid) throw httpError(401, "Authenticated ARI session required");
            await ensureNeonIdentity({
              gid,
              identityScope: gid === OWNER_GID ? "prime" : "consumer",
              displayName: gid === OWNER_GID ? OWNER_MODE : null,
            });
            return gid;
          }

          async function persistRuntimeIntent(req, manifest, intent, requestId) {
            const gid = sessionGid(req);
            if (!gid) return null;
            await ensureNeonIdentity({ gid, identityScope: gid === OWNER_GID ? "prime" : "consumer", displayName: gid === OWNER_GID ? OWNER_MODE : null });
            await recordTwinEvent(gid, "intent", { intent, capability: manifest.capability, page: manifest.page, request_id: requestId, context: req.body?.context || {} });
            await incrementCapabilityUsage(gid, manifest.capability);
            await recordPrediction(gid, { intent, ...manifest }, req.body?.context || {});
            await recordTimeline(gid, { intent, capability: manifest.capability, page: manifest.page, request_id: requestId, state: { source: req.body?.payload?.source || null, manifest } });
            return gid;
          }

          const api = express.Router();'''
          if s.count(marker)!=1: raise SystemExit('api router anchor mismatch')
          s=s.replace(marker,helper,1)

          pattern=re.compile(r'''api\.get\("/timeline".*?api\.get\("/twin/predictions".*?\);\n''',re.S)
          replacement='''api.get("/timeline", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const turns = await getTimeline(gid, req.query.limit);
              res.json(responseBase({ gid, turns, persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.post("/timeline", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const turn = await recordTimeline(gid, req.body || {});
              res.json(responseBase({ gid, accepted: true, turn, persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.get("/state/:gid", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              if (req.params.gid !== gid && gid !== OWNER_GID) throw httpError(403, "GID state access denied");
              const targetGid = req.params.gid;
              await ensureNeonIdentity({ gid: targetGid, identityScope: targetGid === OWNER_GID ? "prime" : "consumer" });
              const twin = await getTwinState(targetGid);
              const timeline = await getTimeline(targetGid, 20);
              res.json(responseBase({ gid: targetGid, state: { twin, timeline }, persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.get("/twin", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const twin = await getTwinState(gid);
              res.json(responseBase({ gid, twin, persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.post("/twin/context", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const body = req.body || {};
              if (body.permissions && typeof body.permissions === "object") await setTwinPermissions(gid, body.permissions);
              if (body.preferences && typeof body.preferences === "object") await setTwinPreferences(gid, body.preferences);
              await recordTwinEvent(gid, "context", body);
              await mergeTwinState(gid, { state: { lastContext: body, lastContextAt: new Date().toISOString() } });
              res.json(responseBase({ gid, accepted: true, twin: await getTwinState(gid), persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.post("/twin/interaction", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const body = req.body || {};
              await recordTwinEvent(gid, "interaction", body);
              if (body.capability) await incrementCapabilityUsage(gid, body.capability);
              await mergeTwinState(gid, { state: { lastInteraction: body, lastInteractionAt: new Date().toISOString() } });
              res.json(responseBase({ gid, accepted: true, persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.post("/twin/outcome", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const body = req.body || {};
              await recordTwinEvent(gid, "outcome", body);
              const type = String(body.type || "").toLowerCase();
              if (type.includes("accepted")) { await adjustTwinConfidence(gid, 0.012); await resolveLatestPrediction(gid, "accepted"); }
              if (type.includes("rejected")) { await adjustTwinConfidence(gid, -0.018); await resolveLatestPrediction(gid, "rejected"); }
              if (type.includes("confirmed")) { await adjustTwinConfidence(gid, 0.008); await resolveLatestPrediction(gid, "confirmed"); }
              res.json(responseBase({ gid, accepted: true, twin: await getTwinState(gid), persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.post("/twin/correction", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const body = req.body || {};
              await recordTwinEvent(gid, "correction", body);
              await adjustTwinConfidence(gid, 0.025);
              await mergeTwinState(gid, { state: { lastCorrection: body, lastCorrectionAt: new Date().toISOString() } });
              res.json(responseBase({ gid, accepted: true, twin: await getTwinState(gid), persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.delete("/twin", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              await clearTwin(gid);
              res.json(responseBase({ gid, cleared: true, persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
          api.get("/twin/predictions", async (req, res, next) => {
            try {
              const gid = await requireTwinGid(req);
              const predictions = await listPredictions(gid, req.query.limit);
              res.json(responseBase({ gid, predictions, persistence: "neon", cloud_sync: true }));
            } catch (error) { next(error); }
          });
'''
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'twin stub patch count={n}')

          old='''      supabase_configured: supabaseConfigured,
              stripe_configured: stripeConfigured,
              billing_configured: billingConfigured,'''
          new='''      neon_configured: neonConfigured,
              twin_persistence: neonConfigured ? "neon" : "unconfigured",
              supabase_configured: supabaseConfigured,
              stripe_configured: stripeConfigured,
              billing_configured: billingConfigured,'''
          if s.count(old)!=1: raise SystemExit('health config anchor mismatch')
          s=s.replace(old,new,1)

          old='''  const runtimeReady = await mercuryReady();
            const ready = providerConfigured && authenticationConfigured && runtimeReady;'''
          new='''  const runtimeReady = await mercuryReady();
            const neonReady = neonConfigured ? await neonHealth() : false;
            const ready = providerConfigured && authenticationConfigured && runtimeReady && neonReady;'''
          if s.count(old)!=1: raise SystemExit('ready computation anchor mismatch')
          s=s.replace(old,new,1)

          old='''      supabase_configured: supabaseConfigured,
              stripe_configured: stripeConfigured,'''
          new='''      neon_configured: neonConfigured,
              neon_ready: neonReady,
              twin_persistence_ready: neonReady,
              supabase_configured: supabaseConfigured,
              stripe_configured: stripeConfigured,'''
          if s.count(old)!=1: raise SystemExit('ready response anchor mismatch')
          s=s.replace(old,new,1)

          # Make existing signed consumer sessions real Neon identities when inspected.
          old='''  if (gid) {
              return res.json(responseBase({ gid, mode: "consumer", authenticated: true, identity_scope: "consumer", clearance: "member", tier: "free", entitlements: TIER_CONFIG.free.entitlements }));
            }'''
          new='''  if (gid) {
              const identity = await ensureNeonIdentity({ gid, identityScope: "consumer" });
              return res.json(responseBase({ gid, mode: "consumer", authenticated: true, identity_scope: identity?.identity_scope || "consumer", clearance: "member", tier: "free", entitlements: TIER_CONFIG.free.entitlements, identity }));
            }'''
          if s.count(old)!=1: raise SystemExit('identity GET consumer anchor mismatch')
          s=s.replace(old,new,1)

          old='''  if (gid) {
              return res.json(responseBase({ gid, mode: "consumer", authenticated: true, identity: { gid, verified: true, clearance: "member", tier: "free" } }));
            }'''
          new='''  if (gid) {
              const stored = await ensureNeonIdentity({ gid, identityScope: "consumer" });
              return res.json(responseBase({ gid, mode: "consumer", authenticated: true, identity: { gid, verified: true, clearance: "member", tier: "free", persisted: Boolean(stored) } }));
            }'''
          if s.count(old)!=1: raise SystemExit('identity POST consumer anchor mismatch')
          s=s.replace(old,new,1)

          pattern=re.compile(r'''api\.post\("/identity/guest", \(req, res, next\) => \{.*?\n\}\);''',re.S)
          replacement='''api.post("/identity/guest", async (req, res, next) => {
            try {
              if (!sessionSecret) throw httpError(503, "ARI session security is not configured");
              if (!neonConfigured) throw httpError(503, "Neon persistence is not configured");
              let gid = generateMemberGid();
              while (gid === OWNER_GID || await getNeonIdentity(gid)) gid = generateMemberGid();
              await ensureNeonIdentity({ gid, identityScope: "consumer", displayName: String(req.body?.display_name || "").trim() || null });
              const expires = Math.floor(Date.now() / 1000) + Number(process.env.ARI_SESSION_TTL_SECONDS || 2592000);
              const token = signSession(gid, expires);
              res.setHeader(
                "Set-Cookie",
                `${SESSION_COOKIE}=${encodeURIComponent(token)}; Path=/; Max-Age=${Math.max(60, expires - Math.floor(Date.now() / 1000))}; HttpOnly; Secure; SameSite=Strict`,
              );
              res.status(201).json(responseBase({ gid, mode: "consumer", authenticated: true, identity_scope: "consumer", tier: "free", expires, persistence: "neon", cloud_sync: true }));
            } catch (error) {
              next(error);
            }
          });'''
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'guest identity patch count={n}')

          # Persist every orchestrated intent before provider execution.
          old='''    const manifest = inferManifest(intent, requestedCapability, req.body?.context || {});
              const capability = manifest.capability;

              const runtime = await orchestrateWithMercury(req, {'''
          new='''    const manifest = inferManifest(intent, requestedCapability, req.body?.context || {});
              const capability = manifest.capability;
              const persistedGid = await persistRuntimeIntent(req, manifest, intent, requestId);

              const runtime = await orchestrateWithMercury(req, {'''
          if s.count(old)!=1: raise SystemExit('runtime persistence anchor mismatch')
          s=s.replace(old,new,1)

          old='''      const result = await generateWithGoogle({
                prompt: intent,
                systemInstruction:
                  "You are Jahorin, the user-facing intelligence inside Agentic Mercury Time Runner. Respond directly to the user's intent and use the active Mercury capability as an instrument.",
                temperature: req.body?.payload?.temperature,
              });
              return res.json('''
          new='''      const result = await generateWithGoogle({
                prompt: intent,
                systemInstruction:
                  "You are Jahorin, the user-facing intelligence inside Agentic Mercury Time Runner. Respond directly to the user's intent and use the active Mercury capability as an instrument.",
                temperature: req.body?.payload?.temperature,
              });
              if (persistedGid) await recordTwinEvent(persistedGid, "result", { request_id: requestId, capability: manifest.capability, page: manifest.page, provider: result.provider, model: result.model });
              return res.json('''
          if s.count(old)!=1: raise SystemExit('runtime result anchor mismatch')
          s=s.replace(old,new,1)

          p.write_text(s)

          env=Path('.env.example')
          e=env.read_text() if env.exists() else ''
          if 'NEON_DATABASE_URL=' not in e:
              e += '\n# Neon Postgres — Jahorin Digital Twin persistence\nNEON_DATABASE_URL=\nNEON_POOL_MAX=5\n'
          env.write_text(e)
          PY

      - name: Validate Neon runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check neon-store.js
          node --check identity-runtime-gateway.js
          node --check manifest-runtime-gateway.js
          grep -q 'persistence: "neon"' server.js
          grep -q 'neon_ready' server.js
          grep -q 'recordPrediction' server.js
          grep -q 'NEON_DATABASE_URL' .env.example
          npm ls pg >/dev/null

      - name: Commit validated branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/thoth-neon-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "THOTH: migrate Jahorin Digital Twin persistence to Neon"
          git pull --rebase origin thoth-neon-migration
          git push origin HEAD:thoth-neon-migration
