name: one-time-member-readiness-server-only

on:
  push:
    branches: [thoth/member-readiness-canonical-billing]
    paths:
      - .github/workflows/one-time-member-readiness-server-only.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/member-readiness-canonical-billing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply member readiness patch
        run: python3 scripts/patch_member_readiness.py
      - name: Validate Node syntax
        run: node --check server.js
      - name: Commit patched server only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Make member auth the public readiness authority"
          git push origin HEAD:thoth/member-readiness-canonical-billing
