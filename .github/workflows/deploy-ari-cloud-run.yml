name: Deploy ARI to Cloud Run
# MA'AT production release: hardened ARI edge + TAE + Neon + GID-scoped device fabric

on:
  push:
    branches: [main]
    paths:
      - 'secure-gateway.js'
      - 'device-fabric.js'
      - 'control-plane-gateway.js'
      - 'server.js'
      - 'neon-runtime-gateway.js'
      - 'neon-store.js'
      - 'manifest-runtime-gateway.js'
      - 'identity-runtime-gateway.js'
      - 'scripts/prove-device-fabric.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/deploy-ari-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-ari-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: ari

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical TAE backend
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reproducible backend install and source gate
        run: |
          set -euo pipefail
          npm ci
          npm run check
          grep -q 'node secure-gateway.js' package.json
          grep -q 'ensureDeviceFabricSchema' secure-gateway.js
          grep -q 'REPLAY_REJECTED' device-fabric.js
          grep -q 'api_rate_limits' device-fabric.js
          grep -q '/identity/guest' server.js
          grep -q 'resolveRuntimeAuthorization' neon-runtime-gateway.js
          grep -q 'runtime_authorization_events' neon-store.js

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Migrate runtime secrets to Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud services enable secretmanager.googleapis.com --project="$GCP_PROJECT_ID" --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/ari-service.json
          : > /tmp/secret-mappings
          : > /tmp/secret-ids

          env_plain() {
            ENV_NAME="$1" python3 - <<'PY'
          import json,os
          obj=json.load(open('/tmp/ari-service.json'))
          name=os.environ['ENV_NAME']
          for container in obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              for item in container.get('env',[]) or []:
                  if item.get('name')==name:
                      print(item.get('value') or '')
                      raise SystemExit
          print('')
          PY
          }

          env_secret_ref() {
            ENV_NAME="$1" python3 - <<'PY'
          import json,os
          obj=json.load(open('/tmp/ari-service.json'))
          name=os.environ['ENV_NAME']
          for container in obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              for item in container.get('env',[]) or []:
                  if item.get('name')!=name: continue
                  ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef') or {}
                  secret=ref.get('name') or ref.get('secret') or ''
                  version=ref.get('key') or ref.get('version') or 'latest'
                  if secret:
                      print(f'{secret}:{version}')
                      raise SystemExit
          print('')
          PY
          }

          ensure_secret() {
            env_name="$1"
            secret_id="$2"
            required="$3"
            generate="$4"
            existing_ref="$(env_secret_ref "$env_name")"
            if [ -n "$existing_ref" ]; then
              ref_secret="${existing_ref%%:*}"
              printf '%s=%s\n' "$env_name" "$existing_ref" >> /tmp/secret-mappings
              printf '%s\n' "$ref_secret" >> /tmp/secret-ids
              echo "Preserving Secret Manager reference for $env_name."
              return 0
            fi

            plain="$(env_plain "$env_name")"
            if ! gcloud secrets describe "$secret_id" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              if [ -z "$plain" ] && [ "$generate" != "yes" ] && [ "$required" != "yes" ]; then
                echo "Optional secret $env_name is not configured; skipping."
                return 0
              fi
              gcloud secrets create "$secret_id" --project="$GCP_PROJECT_ID" --replication-policy=automatic --quiet
            fi

            if [ -n "$plain" ]; then
              printf '%s' "$plain" | gcloud secrets versions add "$secret_id" --project="$GCP_PROJECT_ID" --data-file=- --quiet >/dev/null
              unset plain
              echo "Migrated $env_name from Cloud Run environment storage into Secret Manager."
            elif [ "$generate" = "yes" ]; then
              generated="$(openssl rand -hex 32)"
              printf '%s' "$generated" | gcloud secrets versions add "$secret_id" --project="$GCP_PROJECT_ID" --data-file=- --quiet >/dev/null
              unset generated
              echo "Created persistent Secret Manager authority for $env_name."
            else
              if ! gcloud secrets versions describe latest --secret="$secret_id" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
                if [ "$required" = "yes" ]; then
                  echo "Required secret $env_name has no live value." >&2
                  exit 1
                fi
                echo "Optional secret $env_name has no live version; skipping."
                return 0
              fi
            fi
            printf '%s=%s:latest\n' "$env_name" "$secret_id" >> /tmp/secret-mappings
            printf '%s\n' "$secret_id" >> /tmp/secret-ids
          }

          ensure_secret ARI_SESSION_SECRET ari-session-secret yes yes
          ensure_secret NEON_DATABASE_URL ari-neon-database-url yes no
          ensure_secret STRIPE_SECRET_KEY ari-stripe-secret-key yes no
          ensure_secret STRIPE_WEBHOOK_SECRET ari-stripe-webhook-secret yes no
          ensure_secret OWNER_ACCESS_CODE ari-owner-access-code no no
          ensure_secret GEMINI_API_KEY ari-gemini-api-key no no
          ensure_secret SUPABASE_SECRET_KEY ari-supabase-secret-key no no
          ensure_secret SUPABASE_SERVICE_ROLE_KEY ari-supabase-service-role-key no no
          ensure_secret ARI_WORKER_TOKEN ari-worker-token no no

          SERVICE_ACCOUNT="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(spec.template.spec.serviceAccountName)')"
          if [ -z "$SERVICE_ACCOUNT" ]; then
            SERVICE_ACCOUNT="${GCP_PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          sort -u /tmp/secret-ids -o /tmp/secret-ids
          while IFS= read -r secret_id; do
            [ -n "$secret_id" ] || continue
            gcloud secrets add-iam-policy-binding "$secret_id" \
              --project="$GCP_PROJECT_ID" \
              --member="serviceAccount:${SERVICE_ACCOUNT}" \
              --role="roles/secretmanager.secretAccessor" \
              --quiet >/dev/null
          done < /tmp/secret-ids
          echo "Cloud Run service identity can access only the runtime secrets referenced by this release."

      - name: Configure Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" --repository-format=docker --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --quiet

      - name: Build and push ARI image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          printf 'IMAGE=%s\n' "$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy hardened ARI revision
        shell: bash
        run: |
          set -euo pipefail
          SECRET_FLAGS="$(paste -sd, /tmp/secret-mappings)"
          test -n "$SECRET_FLAGS"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --update-env-vars="NODE_ENV=production,ARI_REQUIRE_AUTH=true,JAHORIN_FREE_ACCESS=false" \
            --update-secrets="$SECRET_FLAGS" \
            --quiet
          CLOUD_RUN_REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$CLOUD_RUN_REVISION"
          printf 'CLOUD_RUN_REVISION=%s\n' "$CLOUD_RUN_REVISION" >> "$GITHUB_ENV"
          echo "Cloud Run revision: $CLOUD_RUN_REVISION"

      - name: Verify Secret Manager wiring without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/deployed-service.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/deployed-service.json'))
          required={'ARI_SESSION_SECRET','NEON_DATABASE_URL','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET'}
          found=set()
          plain=[]
          for container in obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]):
              for item in container.get('env',[]) or []:
                  name=item.get('name')
                  if name not in required: continue
                  ref=(item.get('valueFrom') or {}).get('secretKeyRef') or (item.get('valueSource') or {}).get('secretKeyRef')
                  if ref: found.add(name)
                  elif item.get('value'): plain.append(name)
          if plain:
              raise SystemExit('Required secrets still stored as plaintext env values: '+','.join(sorted(plain)))
          missing=required-found
          if missing:
              raise SystemExit('Required Secret Manager references missing: '+','.join(sorted(missing)))
          print('PASS required Cloud Run secrets are Secret Manager references')
          PY

      - name: Prove live hardened runtime and device fabric
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?release=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = "200" ] && node -e "const j=require('/tmp/ready.json'); if(!(j.ok===true&&j.auth_required===true&&j.auth_configured===true&&j.guest_auth_configured===true&&j.provider_configured===true&&j.mercury_runtime_ready===true&&j.neon_ready===true)) process.exit(1)"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1 || { echo 'Hardened ARI did not reach readiness.' >&2; cat /tmp/ready.json >&2 || true; exit 1; }
          echo 'PASS live ARI readiness'

          curl -sS -D /tmp/security.headers -o /tmp/health.json "$ARI/api/health" >/dev/null
          grep -qi '^strict-transport-security: max-age=31536000' /tmp/security.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/security.headers
          grep -qi '^permissions-policy:' /tmp/security.headers
          grep -qi "^content-security-policy: .*frame-ancestors 'none'" /tmp/security.headers
          echo 'PASS hardened security headers'

          code="$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' -H 'Origin: https://not-authorized.example' "$ARI/api/health")"
          test "$code" = 403
          code="$(curl -sS -D /tmp/good-origin.headers -o /tmp/good-origin.json -w '%{http_code}' -H 'Origin: https://siaas.space' "$ARI/api/health")"
          test "$code" = 200
          grep -qi '^access-control-allow-origin: https://siaas.space' /tmp/good-origin.headers
          echo 'PASS production CORS isolation'

          code="$(curl -sS -o /tmp/unauth-runtime.json -w '%{http_code}' -H 'content-type: application/json' -d '{"intent":"deny anonymous execution","capability":"thoth","module":"mercury","request_id":"ga-anonymous-deny"}' "$ARI/api/runtime")"
          test "$code" = 401
          echo 'PASS anonymous protected execution rejected'

          code="$(curl -sS -c /tmp/cookies -o /tmp/guest.json -w '%{http_code}' -H 'content-type: application/json' -d '{}' "$ARI/api/identity/guest")"
          test "$code" = 201
          node -e "const j=require('/tmp/guest.json'); if(!(j.authenticated===true&&/^\\d{12}$/.test(String(j.gid||'')))) process.exit(1)"
          echo 'PASS signed consumer GID session'

          code="$(curl -sS -b /tmp/cookies -o /tmp/tae.json -w '%{http_code}' --connect-timeout 5 --max-time 90 -H 'content-type: application/json' -H 'x-request-id: ga-thoth-tae' -d '{"prompt":"Confirm Jahorin TAE production execution in one concise sentence.","request_id":"ga-thoth-tae","source_surface":"ga-release","capability":"thoth","machine":"thoth"}' "$ARI/api/tae")"
          test "$code" = 200 || { cat /tmp/tae.json >&2; exit 1; }
          node -e "const j=require('/tmp/tae.json'); const t=String(j?.reply?.text||j?.result?.text||j?.output||'').trim(); const p=String(j?.provider?.name||j?.result?.provider||''); if(!(t&&['google-vertex-ai','google-gemini-api'].includes(p))) process.exit(1)"
          echo 'PASS TAE reached live Google provider'

          code="$(curl -sS -b /tmp/cookies -o /tmp/twin.json -w '%{http_code}' "$ARI/api/twin")"
          test "$code" = 200
          node -e "const j=require('/tmp/twin.json'); if(!(j.ok===true&&j.persistence==='neon'&&j.cloud_sync===true)) process.exit(1)"
          echo 'PASS Twin continuity in Neon'

          ARI="$ARI" node scripts/prove-device-fabric.mjs
          echo 'PASS GID-scoped device fabric positive and negative proof'

      - name: Record hardened release evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const device=JSON.parse(fs.readFileSync('DEVICE_FABRIC_RELEASE_PROOF.json','utf8'));
          const tae=JSON.parse(fs.readFileSync('/tmp/tae.json','utf8'));
          const provider=tae?.provider?.name || tae?.result?.provider || null;
          const evidence={
            release:'ga-candidate',
            backend_commit:process.env.GITHUB_SHA,
            cloud_run_revision:process.env.CLOUD_RUN_REVISION,
            verified_at:new Date().toISOString(),
            checks:{
              backend_clean_install:true,
              secret_manager:true,
              session_auth:true,
              gid:true,
              tae_provider_execution:Boolean(provider),
              neon_persistence:true,
              cors_hardened:true,
              security_headers_hardened:true,
              distributed_rate_limit:true,
              device_enrollment:device.checks?.cryptographic_enrollment===true,
              device_isolation:device.checks?.gid_isolation===true,
              device_revocation:device.checks?.revocation===true,
              device_grants:device.checks?.explicit_grant===true,
              replay_protection:device.checks?.request_replay_rejected===true,
              bad_signature_rejected:device.checks?.bad_signature_rejected===true,
              stripe_lifecycle:false
            }
          };
          fs.writeFileSync('GA_RELEASE_EVIDENCE.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          cat GA_RELEASE_EVIDENCE.json

      - name: Record verified backend release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVICE_FABRIC_RELEASE_PROOF.json GA_RELEASE_EVIDENCE.json
          if git diff --cached --quiet; then
            echo 'Release evidence unchanged.'
            exit 0
          fi
          git commit -m "THOTH: record hardened ARI device-fabric release evidence"
          git pull --rebase origin main
          git push origin HEAD:main
