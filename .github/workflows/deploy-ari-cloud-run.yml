name: Deploy ARI to Cloud Run
# MA'AT production release: authenticated multimodal ARI

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'neon-runtime-gateway.js'
      - 'manifest-runtime-gateway.js'
      - 'identity-runtime-gateway.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/deploy-ari-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-ari-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: ari

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical ARI source
        uses: actions/checkout@v4

      - name: Validate source before deployment
        run: |
          set -euo pipefail
          node --check server.js
          node --check neon-runtime-gateway.js
          node --check manifest-runtime-gateway.js
          node --check identity-runtime-gateway.js
          grep -q '/identity/guest' server.js
          grep -q 'guest_auth_configured' server.js
          grep -q 'function inferManifest' server.js
          grep -q 'normalizeInlineImage' server.js
          grep -q 'inlineData' server.js
          grep -q 'JAHORIN_FREE_ACCESS || "false"' manifest-runtime-gateway.js
          grep -q 'async function handleRuntime' neon-runtime-gateway.js

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve persistent ARI session signing secret
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json)"
          session_secret="$(printf '%s' "$service_json" | python3 -c '
          import json,sys
          obj=json.load(sys.stdin)
          def walk(v):
              if isinstance(v,dict):
                  if v.get("name")=="ARI_SESSION_SECRET" and isinstance(v.get("value"),str) and v.get("value"):
                      return v["value"]
                  for child in v.values():
                      found=walk(child)
                      if found: return found
              elif isinstance(v,list):
                  for child in v:
                      found=walk(child)
                      if found: return found
              return ""
          print(walk(obj))
          ')"
          if [ -z "$session_secret" ]; then
            session_secret="$(openssl rand -hex 32)"
            echo 'Creating a new persistent ARI session signing secret for signed consumer sessions.'
          else
            echo 'Preserving the existing ARI session signing secret.'
          fi
          echo "::add-mask::$session_secret"
          printf 'ARI_SESSION_SECRET=%s\n' "$session_secret" >> "$GITHUB_ENV"

      - name: Configure Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" --repository-format=docker --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --quiet

      - name: Build and push ARI image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy ARI revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --update-env-vars="ARI_REQUIRE_AUTH=true,JAHORIN_FREE_ACCESS=false,ARI_SESSION_SECRET=${ARI_SESSION_SECRET}" \
            --quiet
          CLOUD_RUN_REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$CLOUD_RUN_REVISION"
          printf 'CLOUD_RUN_REVISION=%s\n' "$CLOUD_RUN_REVISION" >> "$GITHUB_ENV"
          echo "Cloud Run revision: $CLOUD_RUN_REVISION"

      - name: Prove live authenticated multimodal runtime
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          for attempt in $(seq 1 48); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/ready.json -w '%{http_code}' "$ARI/api/ready?release=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = "200" ] && node -e "const j=require('/tmp/ready.json'); if(!(j.ok===true&&j.auth_required===true&&j.auth_configured===true&&j.guest_auth_configured===true&&j.provider_configured===true&&j.mercury_runtime_ready===true)) process.exit(1)"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo 'ARI did not reach authenticated multimodal readiness.' >&2
            cat /tmp/ready.json >&2 || true
            exit 1
          fi
          echo 'PASS live ARI reports required auth, signed sessions, provider, and Mercury ready'

          code="$(curl -sS -o /tmp/unauth-runtime.json -w '%{http_code}' -H 'content-type: application/json' -H 'x-request-id: ari-unauth-release-proof' -d '{"intent":"This request must be rejected","capability":"thoth","module":"mercury","request_id":"ari-unauth-release-proof"}' "$ARI/api/runtime")"
          test "$code" = 401 || { echo "Expected anonymous runtime 401, got $code" >&2; cat /tmp/unauth-runtime.json >&2 || true; exit 1; }
          node -e "const j=require('/tmp/unauth-runtime.json'); if(j.ok!==false) process.exit(1)"
          echo 'PASS anonymous runtime rejected with 401'

          code="$(curl -sS -c /tmp/cookies -o /tmp/guest.json -w '%{http_code}' -H 'content-type: application/json' -d '{}' "$ARI/api/identity/guest")"
          test "$code" = 201 || { echo "Expected signed guest session 201, got $code" >&2; cat /tmp/guest.json >&2 || true; exit 1; }
          node -e "const j=require('/tmp/guest.json'); if(!(j.authenticated===true&&/^\\d{12}$/.test(String(j.gid||'')))) process.exit(1)"
          echo 'PASS signed consumer GID session established'

          code="$(curl -sS -b /tmp/cookies -o /tmp/unsupported.json -w '%{http_code}' -H 'content-type: application/json' -H 'x-request-id: ari-optics-invalid-mime-proof' -d '{"intent":"Validate image parser.","capability":"optics","module":"mercury","payload":{"action":"analyze","image":{"mime_type":"application/pdf","data":"QQ=="}},"request_id":"ari-optics-invalid-mime-proof"}' "$ARI/api/runtime")"
          test "$code" = 415 || { echo "Expected authenticated invalid MIME 415, got $code" >&2; cat /tmp/unsupported.json >&2 || true; exit 1; }
          grep -qi 'unsupported inline image MIME type' /tmp/unsupported.json
          echo 'PASS authenticated request reached image parser and invalid MIME returned 415'

          code="$(curl -sS -b /tmp/cookies -o /tmp/optics.json -w '%{http_code}' --connect-timeout 5 --max-time 90 -H 'content-type: application/json' -H 'x-request-id: ari-optics-release-proof' -d '{"intent":"Describe the supplied image briefly.","capability":"optics","module":"mercury","payload":{"action":"analyze","image":{"mime_type":"image/png","data":""}},"request_id":"ari-optics-release-proof"}' "$ARI/api/runtime")"
          test "$code" = 200 || { echo "Expected authenticated multimodal HTTP 200, got $code" >&2; cat /tmp/optics.json >&2 || true; exit 1; }
          node -e "const j=require('/tmp/optics.json'); const m=j?.result?.media_input; if(!(String(j?.result?.text||'').trim()&&m?.type==='image'&&m?.mime_type==='image/png'&&Number(m?.bytes)>0&&['google-vertex-ai','google-gemini-api'].includes(j?.provider?.name))) process.exit(1)"
          echo 'PASS live authenticated PNG reached Google multimodal provider with non-empty response and media evidence'

          code="$(curl -sS -b /tmp/cookies -o /tmp/twin.json -w '%{http_code}' "$ARI/api/twin")"
          test "$code" = 200 || { echo "Expected authenticated Neon twin HTTP 200, got $code" >&2; cat /tmp/twin.json >&2 || true; exit 1; }

          node - <<'NODE'
          const fs=require('fs');
          const ready=JSON.parse(fs.readFileSync('/tmp/ready.json'));
          const guest=JSON.parse(fs.readFileSync('/tmp/guest.json'));
          const optics=JSON.parse(fs.readFileSync('/tmp/optics.json'));
          const media=optics?.result?.media_input || {};
          fs.writeFileSync('ARI_MULTIMODAL_RELEASE_PROOF.json', JSON.stringify({
            ok:true,
            verified_at:new Date().toISOString(),
            service:'ARI',
            runtime:'Mercury',
            auth_required:ready.auth_required===true,
            anonymous_runtime_rejected:true,
            authenticated_runtime_verified:true,
            consumer_gid_verified:/^\d{12}$/.test(String(guest.gid||'')),
            guest_auth_configured:ready.guest_auth_configured===true,
            multimodal_parser_verified:true,
            provider:optics?.provider?.name || null,
            optics_multimodal:{
              has_result:Boolean(String(optics?.result?.text||'').trim()),
              mime_type:media.mime_type,
              bytes:media.bytes
            },
            cloud_run_revision:process.env.CLOUD_RUN_REVISION,
            source_sha:process.env.GITHUB_SHA
          },null,2)+'\n');
          NODE
          cat ARI_MULTIMODAL_RELEASE_PROOF.json

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARI_MULTIMODAL_RELEASE_PROOF.json
          git commit -m "THOTH: verify authenticated multimodal ARI release on Cloud Run"
          git pull --rebase origin main
          git push origin HEAD:main
