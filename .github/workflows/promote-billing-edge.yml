name: Promote ARI Production Edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-billing-edge.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-ari-production-edge
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: ari

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical backend
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify current gateway source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          grep -q 'node authorization-gateway.js' package.json
          grep -q 'production-gateway.js' authorization-gateway.js
          grep -q '/api/identity/authorize' production-gateway.js
          grep -q 'billing-gateway.js' production-gateway.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and push current ARI image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:identity-hotfix-${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Promote authorization gateway as Cloud Run entry
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --command=node \
            --args=authorization-gateway.js \
            --update-env-vars="^@^NODE_ENV=production@ARI_REQUIRE_AUTH=true@JAHORIN_FREE_ACCESS=false@PRODUCTION_ALLOWED_ORIGINS=https://jahorin.space,https://www.jahorin.space,https://jahorin-ga.vercel.app,https://siaas.space,https://www.siaas.space,https://siaas.netlify.app,https://main--siaas.netlify.app" \
            --quiet

          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/after.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/after.json'))
          c=(obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers') or [{}])[0]
          command=c.get('command') or []
          args=c.get('args') or []
          env={x.get('name'):x.get('value') for x in c.get('env',[]) or [] if x.get('value') is not None}
          if command != ['node'] or args != ['authorization-gateway.js']:
              raise SystemExit(f'Cloud Run command mismatch command={command} args={args}')
          origins=set((env.get('PRODUCTION_ALLOWED_ORIGINS') or '').split(','))
          required={'https://jahorin-ga.vercel.app','https://jahorin.space','https://siaas.space'}
          missing=required-origins
          if missing: raise SystemExit('Missing canonical origins: '+','.join(sorted(missing)))
          print('PASS Cloud Run authorization edge and canonical origins')
          print('REVISION=', obj.get('status',{}).get('latestReadyRevisionName'))
          PY

      - name: Prove GID and billing browser contracts live
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ORIGIN='https://jahorin-ga.vercel.app'
          ready=0
          for attempt in $(seq 1 40); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -D /tmp/preflight.headers -o /tmp/preflight.body -w '%{http_code}' \
              -X OPTIONS \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type' \
              "$ARI/api/identity/authorize?proof=$GITHUB_SHA-$attempt" || true)"
            if [ "$code" = 204 ] && grep -qi '^access-control-allow-origin: https://jahorin-ga.vercel.app' /tmp/preflight.headers; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" = 1 || { echo 'Identity preflight never became ready' >&2; cat /tmp/preflight.headers >&2 || true; cat /tmp/preflight.body >&2 || true; exit 1; }
          grep -qi '^access-control-allow-credentials: true' /tmp/preflight.headers

          code="$(curl -sS --connect-timeout 5 --max-time 15 -D /tmp/invalid.headers -o /tmp/invalid.json -w '%{http_code}' \
            -H "Origin: $ORIGIN" -H 'content-type: application/json' -d '{"gid":"123"}' "$ARI/api/identity/authorize")"
          test "$code" = 400 || { cat /tmp/invalid.json >&2; exit 1; }
          grep -qi '^access-control-allow-origin: https://jahorin-ga.vercel.app' /tmp/invalid.headers
          node -e "const j=require('/tmp/invalid.json'); if(j.code!=='INVALID_GID') process.exit(1)"

          code="$(curl -sS --connect-timeout 5 --max-time 15 -D /tmp/session.headers -o /tmp/session.json -w '%{http_code}' -H "Origin: $ORIGIN" "$ARI/api/identity/session")"
          test "$code" = 200 || { cat /tmp/session.json >&2; exit 1; }
          grep -qi '^access-control-allow-origin: https://jahorin-ga.vercel.app' /tmp/session.headers
          node -e "const j=require('/tmp/session.json'); if(!(j.ok===true&&j.authenticated===false)) process.exit(1)"

          code="$(curl -sS --connect-timeout 5 --max-time 20 -D /tmp/catalog.headers -o /tmp/catalog.json -w '%{http_code}' -H "Origin: $ORIGIN" "$ARI/api/billing/catalog")"
          test "$code" = 200 || { cat /tmp/catalog.json >&2; exit 1; }
          grep -qi '^access-control-allow-origin: https://jahorin-ga.vercel.app' /tmp/catalog.headers
          echo 'PASS live Jahorin GID preflight, session, error transport, and billing catalog.'

# identity transport hotfix promotion
