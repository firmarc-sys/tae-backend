name: Verify ARI Secret Authorities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ari-secret-authorities.yml'
      - '.github/workflows/deploy-ari-cloud-run-v2.yml'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: ${{ matrix.label }} · ${{ matrix.secret }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ARI session
            secret: ari-session-secret
          - label: Prime credential
            secret: ari-owner-access-code
          - label: Neon identity
            secret: ari-neon-database-url
          - label: Supabase credential
            secret: ari-supabase-secret-key
          - label: Stripe secret
            secret: ari-stripe-secret-key
          - label: Stripe webhook
            secret: ari-stripe-webhook-secret
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/689058655022/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@project-7e6f2720-0291-4c91-8c3.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-7e6f2720-0291-4c91-8c3
      - name: Prove secret exists and has enabled version
        shell: bash
        run: |
          set -euo pipefail
          secret='${{ matrix.secret }}'
          gcloud secrets describe "$secret" --project='project-7e6f2720-0291-4c91-8c3' >/dev/null
          version="$(gcloud secrets versions list "$secret" --project='project-7e6f2720-0291-4c91-8c3' --filter='state=ENABLED' --limit=1 --sort-by='~createTime' --format='value(name)')"
          test -n "$version" || { echo "No enabled version exists for $secret" >&2; exit 1; }
          echo "PASS $secret has an enabled Secret Manager version"
