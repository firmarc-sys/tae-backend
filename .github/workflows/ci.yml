name: production-gateway-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Check gateway syntax
        run: node --check server.js
      - name: Verify HeyCyan Optics policy
        run: npm run verify:heycyan
      - name: Run local ARI contract smoke
        shell: bash
        env:
          PORT: '8080'
          ARI_SESSION_SECRET: test-session-secret-for-ci-only
          OWNER_ACCESS_CODE: test-owner-code
          ARI_REQUIRE_AUTH: 'true'
          VERTEX_PROJECT: '689058655022'
          VERTEX_LOCATION: global
        run: |
          set -euo pipefail
          node server.js > /tmp/ari.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health >/tmp/health.json && break
            sleep .25
          done
          curl -fsS http://127.0.0.1:8080/api/ready >/tmp/ready.json
          curl -fsS http://127.0.0.1:8080/api/identity >/tmp/identity.json
          curl -fsS http://127.0.0.1:8080/api/render-state >/tmp/render.json
          curl -fsS http://127.0.0.1:8080/api/iot >/tmp/iot.json
          curl -fsS http://127.0.0.1:8080/api/syncori >/tmp/syncori.json
          curl -fsS http://127.0.0.1:8080/api/tae >/tmp/tae.json

          bad_code="$(curl -sS -o /tmp/bad-auth.json -w '%{http_code}' -H 'content-type: application/json' -d '{"access_code":"wrong"}' http://127.0.0.1:8080/api/identity/session)"
          test "$bad_code" = '401'

          unauth_demo="$(curl -sS -o /tmp/unauth-demo.json -w '%{http_code}' -H 'content-type: application/json' -d '{"prompt":"TAE, enter Demo Mode"}' http://127.0.0.1:8080/api/tae)"
          test "$unauth_demo" = '401'

          curl -fsS -c /tmp/cookies.txt -H 'content-type: application/json' -d '{"access_code":"test-owner-code"}' http://127.0.0.1:8080/api/identity/session >/tmp/session.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8080/api/identity >/tmp/authenticated.json
          curl -fsS -b /tmp/cookies.txt -H 'content-type: application/json' -d '{"prompt":"TAE, enter Demo Mode"}' http://127.0.0.1:8080/api/tae >/tmp/demo.json

          unauth_runtime="$(curl -sS -o /tmp/unauth-runtime.json -w '%{http_code}' -H 'content-type: application/json' -d '{"capability":"text","intent":"test"}' http://127.0.0.1:8080/api/runtime)"
          test "$unauth_runtime" = '401'

          unauth_iot="$(curl -sS -o /tmp/unauth-iot.json -w '%{http_code}' -H 'content-type: application/json' -d '{"operation":"glasses.connect"}' http://127.0.0.1:8080/api/iot)"
          test "$unauth_iot" = '401'

          blocked_firmware="$(curl -sS -b /tmp/cookies.txt -o /tmp/blocked-firmware.json -w '%{http_code}' -H 'content-type: application/json' -d '{"operation":"glasses.firmware.update"}' http://127.0.0.1:8080/api/iot)"
          test "$blocked_firmware" = '409'

          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/health.json'))
          ready=json.load(open('/tmp/ready.json'))
          identity=json.load(open('/tmp/identity.json'))
          iot=json.load(open('/tmp/iot.json'))
          demo=json.load(open('/tmp/demo.json'))
          authenticated=json.load(open('/tmp/authenticated.json'))
          blocked_firmware=json.load(open('/tmp/blocked-firmware.json'))
          assert health['service']=='ARI' and health['runtime']=='Mercury'
          assert ready['ok'] is True and ready['provider_configured'] is True
          assert ready['auth_configured'] is True and ready['auth_required'] is True
          assert identity['authenticated'] is False
          assert iot['market_category']['abbreviation']=='S.I.aaS'
          assert iot['status']=='companion_required' and iot['executed'] is False
          assert iot['policy']['android_companion']['target_sdk']==36
          assert iot['policy']['firmware']['update_enabled'] is False
          assert blocked_firmware['code']=='FIRMWARE_UPDATE_DISABLED'
          assert demo['demo'] is True and demo['message']=='This is not an app. This is me.'
          assert authenticated['authenticated'] is True
          print('ARI gateway contract: PASS')
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t ari-gateway .

  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source gate
        run: npm run check
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase and apply repository migrations
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml || supabase init --force
          supabase start -x studio,imgproxy,inbucket,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "NEON_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"
      - name: Start full credential-gateway chain
        shell: bash
        env:
          PORT: '18080'
          NODE_ENV: production
          ARI_REQUIRE_AUTH: 'true'
          JAHORIN_FREE_ACCESS: 'false'
          ARI_SESSION_SECRET: ci-only-session-secret-not-production
          OWNER_ACCESS_CODE: ci-only-owner-access-code
          GOOGLE_CLOUD_PROJECT: ci-no-vertex
          VERTEX_LOCATION: global
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
        run: |
          set -euo pipefail
          nohup node credential-gateway.js > /tmp/chain.log 2>&1 &
          for i in $(seq 1 90); do
            code="$(curl -s -o /tmp/edge.json -w '%{http_code}' http://127.0.0.1:18080/api/credential-edge || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          cat /tmp/edge.json || true
          test "$code" = 200 || { tail -100 /tmp/chain.log; exit 1; }
      - name: Prove tenant isolation through the public edge
        env:
          ARI: http://127.0.0.1:18080
          OWNER_ACCESS_CODE: ci-only-owner-access-code
        run: node scripts/prove-tenant-isolation.mjs
      - name: Chain log
        if: always()
        run: tail -200 /tmp/chain.log || true
