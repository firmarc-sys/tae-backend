name: Jahorin GA End-to-End

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy ARI to Cloud Run']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: jahorin-ga-e2e
  cancel-in-progress: false

env:
  ARI: https://ari-689058655022.us-west1.run.app

jobs:
  ga-e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical backend
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Prove public production chain without production signing secrets
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/ready.json -w '%{http_code}' --connect-timeout 5 --max-time 20 "$ARI/api/ready")"
          test "$code" = 200
          node -e "const j=require('/tmp/ready.json'); if(!(j.ok===true&&j.auth_required===true&&j.provider_configured===true&&j.mercury_runtime_ready===true&&j.neon_ready===true)) process.exit(1)"
          echo 'PASS readiness'

          code="$(curl -sS -c /tmp/cookies -o /tmp/guest.json -w '%{http_code}' -H 'content-type: application/json' -d '{}' "$ARI/api/identity/guest")"
          test "$code" = 201
          node -e "const j=require('/tmp/guest.json'); if(!(j.authenticated===true&&/^\\d{12}$/.test(String(j.gid||'')))) process.exit(1)"
          echo 'PASS signed GID session'

          code="$(curl -sS -b /tmp/cookies -o /tmp/identity.json -w '%{http_code}' "$ARI/api/identity")"
          test "$code" = 200
          GID="$(node -e "const j=require('/tmp/guest.json'); process.stdout.write(String(j.gid))")" node -e "const j=require('/tmp/identity.json'); if(String(j.gid)!==process.env.GID) process.exit(1)"
          echo 'PASS identity continuity'

          code="$(curl -sS -b /tmp/cookies -o /tmp/tae.json -w '%{http_code}' --connect-timeout 5 --max-time 90 -H 'content-type: application/json' -H 'x-request-id: ga-public-thoth' -d '{"prompt":"Respond with one concise sentence confirming Jahorin TAE production execution.","request_id":"ga-public-thoth","source_surface":"ga-release","capability":"thoth","machine":"thoth"}' "$ARI/api/tae")"
          test "$code" = 200 || { cat /tmp/tae.json >&2; exit 1; }
          node -e "const j=require('/tmp/tae.json'); const text=String(j?.reply?.text||j?.result?.text||j?.output||'').trim(); const provider=String(j?.provider?.name||j?.result?.provider||''); if(!(text&&['google-vertex-ai','google-gemini-api'].includes(provider))) process.exit(1)"
          echo 'PASS TAE through live Google provider'

          code="$(curl -sS -b /tmp/cookies -o /tmp/entitlement-deny.json -w '%{http_code}' -H 'content-type: application/json' -d '{"intent":"Generate a protected video.","capability":"optics","module":"mercury","payload":{"action":"video_generate"},"request_id":"ga-public-deny"}' "$ARI/api/runtime")"
          test "$code" = 403
          node -e "const j=require('/tmp/entitlement-deny.json'); if(!(j.code==='ENTITLEMENT_REQUIRED'&&j?.authorization?.result==='deny')) process.exit(1)"
          echo 'PASS entitlement denial before provider execution'

          code="$(curl -sS -b /tmp/cookies -o /tmp/twin.json -w '%{http_code}' "$ARI/api/twin")"
          test "$code" = 200
          node -e "const j=require('/tmp/twin.json'); if(!(j.ok===true&&j.persistence==='neon'&&j.cloud_sync===true)) process.exit(1)"
          echo 'PASS Twin / Neon continuity'

          ARI="$ARI" node scripts/prove-device-fabric.mjs
          echo 'PASS cryptographic device lifecycle, GID isolation and replay protection'

      - name: Enforce GA evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test -f GA_RELEASE_EVIDENCE.json || { echo 'GA_RELEASE_EVIDENCE.json has not been recorded by the Cloud Run release.' >&2; exit 1; }
          node - <<'NODE'
          const j=require('./GA_RELEASE_EVIDENCE.json');
          const required=[
            'backend_clean_install','secret_manager','session_auth','gid','tae_provider_execution','neon_persistence',
            'cors_hardened','security_headers_hardened','distributed_rate_limit','device_enrollment','device_isolation',
            'device_revocation','device_grants','replay_protection','bad_signature_rejected','stripe_lifecycle'
          ];
          const failed=required.filter((key)=>j?.checks?.[key]!==true);
          if(failed.length){
            console.error(`GA BLOCKED: ${failed.join(', ')} not verified true.`);
            process.exit(1);
          }
          console.log('PASS all machine-readable GA gates are true');
          NODE
