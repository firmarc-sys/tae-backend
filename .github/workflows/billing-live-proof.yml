name: Jahorin Billing Live Proof

on:
  push:
    branches: [main]
    paths:
      - 'billing-gateway.js'
      - 'subscription-entitlement-gateway.js'
      - 'control-plane-gateway.js'
      - 'package.json'
      - '.github/workflows/billing-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: billing-live-proof
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: project-7e6f2720-0291-4c91-8c3
  GCP_PROJECT_NUMBER: '689058655022'
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ari

jobs:
  billing-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical backend
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify canonical ARI edge without mutating production
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/service.json'))
          c=(obj.get('spec',{}).get('template',{}).get('spec',{}).get('containers') or [{}])[0]
          command=c.get('command') or []
          args=c.get('args') or []
          if command != ['node'] or args != ['authorization-gateway.js']:
              raise SystemExit(f'Cloud Run edge is not canonical: command={command} args={args}')
          print('IMAGE=', c.get('image'))
          print('COMMAND=', command)
          print('ARGS=', args)
          print('LATEST_CREATED=', obj.get('status',{}).get('latestCreatedRevisionName'))
          print('LATEST_READY=', obj.get('status',{}).get('latestReadyRevisionName'))
          PY

      - name: Prove live billing catalog authority
        shell: bash
        run: |
          set -euo pipefail
          ARI="https://ari-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          ready=0
          : > /tmp/billing.headers
          : > /tmp/billing-catalog.json
          for attempt in 1 2 3; do
            code="$(curl -sS --connect-timeout 5 --max-time 10 -D /tmp/billing.headers -o /tmp/billing-catalog.json -w '%{http_code}' -H 'Origin: https://siaas.space' "$ARI/api/billing/catalog?proof=$GITHUB_SHA-$attempt" || true)"
            echo "ATTEMPT=$attempt HTTP=$code"
            cat /tmp/billing.headers || true
            cat /tmp/billing-catalog.json || true
            if [ "$code" = 200 ] && grep -qi '^x-billing-authority: stripe-neon-v1' /tmp/billing.headers; then
              if node -e "const j=require('/tmp/billing-catalog.json'); if(!(j.ok===true&&j.authority==='Stripe + Neon'&&j.pricing_source==='stripe')) process.exit(1)"; then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'Live billing authority failed exact contract proof.' >&2; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('/tmp/billing-catalog.json', 'utf8'));
          const required = ['free','personal','pro','business','enterprise'];
          const ids = Array.isArray(catalog.tiers) ? catalog.tiers.map((tier) => tier.id) : [];
          for (const tier of required) if (!ids.includes(tier)) throw new Error(`missing canonical billing tier: ${tier}`);
          const paid = catalog.tiers.filter((tier) => tier.id !== 'free');
          const configured = paid.filter((tier) => tier.checkout_configured === true && tier.price?.id).length;
          const proof = {
            ok: true,
            verified_at: new Date().toISOString(),
            endpoint: 'https://ari-689058655022.us-west1.run.app',
            authority: catalog.authority,
            pricing_source: catalog.pricing_source,
            billing_configured: catalog.billing_configured === true,
            paid_tiers_configured: configured,
            paid_tiers_expected: paid.length,
            tiers: catalog.tiers.map((tier) => ({
              id: tier.id,
              checkout_configured: tier.checkout_configured === true,
              price: tier.price ? {
                id: tier.price.id,
                currency: tier.price.currency,
                unit_amount: tier.price.unit_amount,
                recurring: tier.price.recurring,
                lookup_key: tier.price.lookup_key,
                product: tier.price.product,
              } : null,
            })),
          };
          fs.writeFileSync('BILLING_LIVE_PROOF.json', JSON.stringify(proof, null, 2) + '\n');
          console.log(JSON.stringify(proof, null, 2));
          NODE

      - name: Commit honest billing proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BILLING_LIVE_PROOF.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'THOTH: record live Stripe billing catalog proof'
          git pull --rebase origin main
          git push origin HEAD:main
