services:
  - type: web
    name: tae-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.5-flash
      - key: SIOS_OWNER_GID
        value: "399152573423"
      - key: ALLOWED_ORIGINS
        value: https://siaas.space,https://www.siaas.space
